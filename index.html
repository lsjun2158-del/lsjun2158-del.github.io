<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WMW</title>
<meta name="description" content="Welcome My World — WMW 가 만드는 앱.">
<meta name="theme-color" content="#08080B">
<link rel="canonical" href="https://welcomemyworld.dev/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WMW">
<meta property="og:title" content="WMW — Welcome My World">
<meta property="og:url" content="https://welcomemyworld.dev/">
<meta property="og:locale" content="ko_KR">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* WMW 대문 — 프로젝트로 가는 문. WMW 디자인 시스템(검정 · 보라)과 앱의 판(컷 코너 · 브래킷) */
:root{--bg:#08080B;--card:#131318;--edge:rgba(138,106,255,.55);--text:#EDEDF2;--text2:#A8A8B8;--accent:#A78FFF;--font:"Pretendard",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font:400 17px/1.45 var(--font);letter-spacing:-.2px;word-break:keep-all;-webkit-font-smoothing:antialiased}
::selection{background:#6E4BFF;color:#fff}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.page{min-height:100svh;display:grid;grid-template-rows:1fr auto;position:relative;overflow:hidden}
.page::before{content:"";position:absolute;inset:0;background:radial-gradient(45% 40% at 50% 38%,rgba(110,75,255,.16),transparent 72%);pointer-events:none}
main{position:relative;display:grid;place-content:center;justify-items:center;gap:48px;padding:72px max(20px,4vw) 40px;text-align:center}
h1{display:grid;gap:10px}
h1 b{font:800 clamp(56px,9vw,104px)/.9 var(--font);letter-spacing:-3px}
h1 span{font:500 clamp(17px,1.6vw,20px)/1.3 var(--font);color:var(--text2);letter-spacing:.5px}
.list{display:grid;gap:12px;width:min(480px,100%)}

/* 프로젝트 카드 — 앱의 판: 컷 코너(좌상·우하) + 브래킷(우상·좌하), 테는 두 겹 판 */
.proj{--cc:16px;--w:1.25px;position:relative;isolation:isolate;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 22px 18px 18px;text-align:left;text-decoration:none;transition:transform .14s cubic-bezier(.2,0,0,1)}
.proj::before,.proj::after{content:"";position:absolute;z-index:-1}
.proj::before{inset:0;background:var(--edge);clip-path:polygon(var(--cc) 0,100% 0,100% calc(100% - var(--cc)),calc(100% - var(--cc)) 100%,0 100%,0 var(--cc))}
.proj::after{--ci:calc(var(--cc) - var(--w) * .586);inset:var(--w);background:var(--card);clip-path:polygon(var(--ci) 0,100% 0,100% calc(100% - var(--ci)),calc(100% - var(--ci)) 100%,0 100%,0 var(--ci))}
.proj:hover{--card:#1B1B22;--edge:rgba(167,143,255,.85)}
.proj:active{transform:scale(.98)}
.bk{position:absolute;width:11px;height:11px;border:0 solid rgba(167,143,255,.7)}
.bk.tr{top:6px;right:6px;border-top-width:1.25px;border-right-width:1.25px}
.bk.bl{bottom:6px;left:6px;border-bottom-width:1.25px;border-left-width:1.25px}
.ico{position:relative;width:56px;height:56px;border-radius:13px;background:#300054;overflow:hidden}
.ico i{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;background:#fff;-webkit-mask:url(soloclimbing/img/star.png) center/contain no-repeat;mask:url(soloclimbing/img/star.png) center/contain no-repeat}
.proj b{display:block;font:700 19px/1.25 var(--font)}
.proj small{display:block;font-size:15px;color:var(--text2);margin-top:3px}
.proj .go{color:var(--accent);font-size:15px;font-weight:600;white-space:nowrap}
footer{position:relative;text-align:center;padding:0 20px 24px;font-size:14px;color:var(--text2)}
@media (max-width:420px){.proj{grid-template-columns:auto 1fr;padding-right:18px}.proj .go{grid-column:2}}
</style></head><body>
<div class="page">
 <main>
  <h1><b>WMW</b><span>Welcome My World</span></h1>
  <nav class="list" aria-label="프로젝트">
   <a class="proj" href="soloclimbing/">
    <span class="bk tr" aria-hidden="true"></span><span class="bk bl" aria-hidden="true"></span>
    <span class="ico" aria-hidden="true"><i></i></span>
    <span><b>Solo Climbing</b><small>혼자 찍은 클라이밍 영상을 완등 장면으로</small></span>
    <span class="go">보러 가기 →</span>
   </a>
  </nav>
 </main>
 <footer>© 2026 WMW</footer>
</div>
</body></html>
