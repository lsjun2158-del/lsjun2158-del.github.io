<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WELMAWORLD 관리</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08080B">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>
// 이 껍데기가 탭 안(iframe)에 다시 뜨면 — 로그아웃 · 로그인 넘김이 /admin/ 으로 보낸 경우 — 맨 위 창으로 빠져나간다
if (window.top !== window) window.top.location.replace(location.href);
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* WELMAWORLD 관리 입구 — 한 페이지에 탭 셋(HQ · Solo Climbing · 세션 별자리). 로그인은 여기서 한 번.
   탭 내용은 같은 주소 아래의 화면을 iframe 으로 띄운다. 처음 열 때 불러 두고 탭을 바꿔도 살려 둔다 */
:root{--bg:#08080B;--surface:#131318;--line:#2A2A34;--text:#EDEDF2;--text2:#A8A8B8;--text3:#7A7A8C;--accent:#A78FFF;--warn:#F0B845;
 --font:"Pretendard",system-ui,-apple-system,"Malgun Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font);letter-spacing:-.2px;word-break:keep-all;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px 20px;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.bar [role=tab]{display:inline-flex;align-items:center;min-height:42px;margin-bottom:-1px;font:700 14px/1.25 var(--font);color:var(--text3);border-bottom:2px solid transparent;border-radius:0}
.bar [role=tab]:hover{color:var(--text)}
.bar [role=tab][aria-selected=true]{color:#F1EDFF;border-bottom-color:var(--accent)}
.bar .out{margin-left:auto;min-height:32px;padding:0 10px;border-radius:8px;font-size:12px;color:var(--text3);box-shadow:inset 0 0 0 1px var(--line)}
.bar .out:hover{color:var(--warn)}
/* 좁은 폰에서 로그아웃이 둘째 줄로 밀리지 않게 */
@media (max-width:480px){.bar{gap:2px 14px}.bar .out{padding:0 8px}}
.panes{flex:1;min-height:0;position:relative}
.panes iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.gate{flex:1;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate .box{width:100%;max-width:360px;display:grid;gap:14px;justify-items:center;text-align:center;padding:28px 24px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.gate b{font:800 15px/1.3 var(--font);letter-spacing:.13em}
.gate .in{width:100%;min-height:44px;border-radius:8px;background:#8257FF;color:#fff;font-weight:700}
.gate p{font-size:13px;color:var(--text2);overflow-wrap:anywhere}
.gate p.err{color:var(--warn)}
</style>
</head><body>
<nav class="bar" role="tablist" aria-label="관리 화면">
 <button type="button" role="tab" data-t="hq" aria-selected="false">HQ</button>
 <button type="button" role="tab" data-t="sc" aria-selected="false">Solo Climbing</button>
 <button type="button" role="tab" data-t="sessions" aria-selected="false">세션 별자리</button>
 <button type="button" class="out" id="out" hidden>로그아웃</button>
</nav>
<section class="gate" id="gate">
 <div class="box">
  <b>WELMAWORLD</b>
  <button type="button" class="in" id="in" hidden>Google 로 로그인</button>
  <p id="msg">로그인 확인 중…</p>
 </div>
</section>
<div class="panes" id="panes" hidden></div>
<script>
(function () {
  "use strict";
  // 탭 → 화면. 화면들은 각자 정본이 따로 있다(HQ · 세션 별자리: WMW/공통/HQ/web, Solo Climbing: 프로젝트 docs/devsite)
  var TABS = { hq: "/admin/hq/", sc: "/admin/soloclimbing/", sessions: "/admin/sessions/" };
  // 화면들이 스스로 그리는 탭 줄은 여기서 숨긴다 — 탭 줄은 이 껍데기 하나만
  var HIDE_CSS = "nav.site{display:none!important}";

  // 공개 설정값 — 읽기는 각 프로젝트 보안 규칙이 오너 계정에만 연다
  var HQ = { apiKey: "AIzaSyAjF8hR6dHgIBD5-_AzSu5qRcLN46jPvKI", authDomain: "wmw-hq.firebaseapp.com", projectId: "wmw-hq",
    storageBucket: "wmw-hq.firebasestorage.app", messagingSenderId: "953566283020", appId: "1:953566283020:web:b8b505a01ff9d90870f529" };
  var SC = { apiKey: "AIzaSyBT2706pHuJZNlCb_eXFR86dBj1q7E1HDg", authDomain: "solo-climbing.firebaseapp.com", projectId: "solo-climbing",
    storageBucket: "solo-climbing.firebasestorage.app", messagingSenderId: "237692887773", appId: "1:237692887773:web:7167f357e7f6100e01b134" };
  // 앱 이름이 화면들과 같아야 저장된 로그인을 서로 받는다 — wmw-hq 는 기본 앱, solo-climbing 은 'sc'
  var auth = firebase.initializeApp(HQ).auth(), fs = firebase.app().firestore();
  var scAuth = firebase.initializeApp(SC, "sc").auth();
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });

  var $ = function (id) { return document.getElementById(id); };
  var qs = new URLSearchParams(location.search);
  // 다른 화면이 로그인을 맡기며 보낸 «돌아갈 곳» 은 탭으로 바꾼다
  var NEXT_TAB = null;
  Object.keys(TABS).forEach(function (k) { if (qs.get("next") === TABS[k]) NEXT_TAB = k; });
  var LOGOUT = qs.get("logout") === "1";
  if (location.search) history.replaceState(null, "", "/admin/" + location.hash);

  function msg(t, err) { $("msg").textContent = t; $("msg").className = err ? "err" : ""; }
  function ask(t, err) { $("panes").hidden = true; $("gate").hidden = false; $("out").hidden = true; $("in").hidden = false; msg(t, err); }

  /** 같은 Google 로그인으로 Solo Climbing 에도 (solo-climbing 이 wmw-hq 웹 클라이언트를 허용해 두었다) */
  function linkSc(res) {
    var tok = res && res.credential && res.credential.idToken;
    if (!tok) return Promise.resolve();
    return scAuth.signInWithCredential(firebase.auth.GoogleAuthProvider.credential(tok)).catch(function () {});
  }
  function signOutAll() {
    try { localStorage.removeItem("wmw-hq-v1"); sessionStorage.removeItem("wmw-sc-auto"); } catch (e) {}
    return Promise.all([auth.signOut(), scAuth.signOut()]).catch(function () {});
  }

  $("in").onclick = function () {
    $("in").hidden = true; msg("로그인 창을 여는 중…");
    // 같은 계정으로 다시 로그인하면 상태 변화 알림이 오지 않으므로, 끝나면 직접 다시 살핀다
    auth.signInWithPopup(provider).then(function (res) { return linkSc(res).then(check); }, function (err) {
      if (/popup-blocked|popup-closed|cancelled-popup|operation-not-supported/.test(err && err.code || "")) return auth.signInWithRedirect(provider);
      ask("로그인하지 못했어요. 다시 눌러 주세요.", true);
    });
  };
  $("out").onclick = function () { signOutAll().then(function () { location.replace("/admin/"); }); };

  /* ---------- 탭 ----------
   * 맨 위 주소의 해시: #sc · #sessions 는 그 탭. HQ 는 자기 화면을 해시(#/home · #/projects/<id> …)로 바꾸므로
   * HQ 탭일 때는 HQ 의 해시를 그대로 맨 위에 비춘다 — 새로고침 · 즐겨찾기 · 링크가 HQ 의 그 화면으로 돌아오게 */
  var cur = null, hqHash = "";
  function tabOf(h) { h = h.replace(/^#/, ""); return h === "sc" || h === "sessions" ? h : "hq"; }
  function hqHashOf(h) { return /^#\//.test(h) ? h : ""; }
  function mirror() {
    var want = cur === "hq" ? (hqHash || "#hq") : "#" + cur;
    if (location.hash !== want) history.replaceState(null, "", "/admin/" + want);
  }
  function pick(t) {
    cur = TABS[t] ? t : "hq";
    [].forEach.call(document.querySelectorAll("[role=tab]"), function (b) { b.setAttribute("aria-selected", String(b.dataset.t === cur)); });
    if ($("panes").hidden) return;   // 로그인이 끝나기 전에는 화면을 부르지 않는다(화면마다 로그인 문이 번쩍이지 않게)
    var f = document.querySelector('iframe[data-t="' + cur + '"]');
    if (!f) {
      var t2 = cur;
      f = document.createElement("iframe");
      f.dataset.t = t2; f.title = { hq: "HQ", sc: "Solo Climbing", sessions: "세션 별자리" }[t2];
      f.addEventListener("load", function () {
        try {
          var s = f.contentDocument.createElement("style"); s.textContent = HIDE_CSS; f.contentDocument.head.appendChild(s);
          if (t2 === "hq") f.contentWindow.addEventListener("hashchange", function () {
            hqHash = hqHashOf(f.contentWindow.location.hash); if (cur === "hq") mirror();
          });
        } catch (e) {}
      });
      f.src = TABS[t2] + (t2 === "hq" ? hqHash : "");
      $("panes").appendChild(f);
    }
    [].forEach.call($("panes").children, function (x) { x.hidden = x !== f; });
    mirror();
  }
  document.querySelector(".bar").addEventListener("click", function (e) {
    var b = e.target.closest("[role=tab]"); if (b) pick(b.dataset.t);
  });
  // 손으로 맨 위 해시를 바꾸거나 뒤로 가기 — HQ 해시면 HQ 화면도 그리로
  addEventListener("hashchange", function () {
    var h = hqHashOf(location.hash);
    if (h && h !== hqHash) {
      hqHash = h;
      var f = document.querySelector('iframe[data-t="hq"]');
      if (f) try { f.contentWindow.location.hash = h; } catch (e) {}
    }
    pick(tabOf(location.hash));
  });
  hqHash = hqHashOf(location.hash);
  pick(NEXT_TAB || tabOf(location.hash));

  /* ---------- 로그인 한 번 — 두 프로젝트 다 되어야 연다 ---------- */
  var scKnown = new Promise(function (r) { var off = scAuth.onAuthStateChanged(function () { off(); r(); }); });
  function check() {
    var u = auth.currentUser;
    if (!u) { ask(LOGOUT ? "로그아웃했어요." : "오너 계정으로만 열려요."); return; }
    msg("확인하는 중…");
    // 오너인지는 규칙이 정한다 — 오너만 읽을 수 있는 문서가 읽히면 오너다
    fs.doc("feed/meta").get().then(function () {
      return scKnown.then(function () {
        // 이 판 전에 로그인해 Solo Climbing 만 비어 있는 브라우저 — 단추 한 번(팝업)으로 붙인다.
        // 클릭 없는 리디렉트 받기는 게시본에서 결과가 비어 껐다(11-13, authDomain 이 사이트와 달라 막히는 것으로 추정)
        if (!scAuth.currentUser) { ask("Solo Climbing 까지 함께 열려면 한 번 더 로그인해 주세요. (처음 한 번)"); return; }
        $("gate").hidden = true; $("panes").hidden = false; $("out").hidden = false;
        pick(cur);
      });
    }, function (err) {
      signOutAll();
      ask(err && err.code === "permission-denied" ? "이 계정은 볼 수 없어요. 오너 계정으로 다시 로그인해 주세요." : "저장소에 닿지 못했어요. 잠시 뒤 다시 열어 주세요.", true);
    });
  }
  var start = LOGOUT ? signOutAll() : auth.getRedirectResult().then(linkSc, function () {});
  start.then(function () { auth.onAuthStateChanged(check); });
})();
</script>
</body></html>
