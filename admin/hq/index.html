  /* ---------- flowchart (roadmap workflow) ---------- */
  var NODE_W = 176, NODE_H = 52, NODE_GAP_Y = 92;

  function emptyFlow() { return { nodes: [] }; }
  function flowAutoY(flow) {
    var maxY = 0;
    (flow.nodes || []).forEach(function (n) { if (n.y > maxY) maxY = n.y; });
    return flow.nodes.length ? maxY + NODE_GAP_Y : 20;
  }

  // Renders a flow as an SVG. `editable` wires up drag/delete/add affordances;
  // a read-only render (project detail, knowledge doc) omits them.
  function renderFlowView(flow, editable) {
    flow = flow && flow.nodes ? flow : emptyFlow();
    var nodes = flow.nodes || [];
    if (!nodes.length && !editable) {
      return '<div class="flow-wrap" id="flowWrap"><p class="empty" style="margin:0;padding:20px">아직 단계가 없습니다. 편집에서 단계를 추가해 주세요.</p></div>';
    }

    var minX = 0, minY = 0, maxX = 640, maxY = 200;
    if (nodes.length) {
      minX = Math.min.apply(null, nodes.map(function (n) { return n.x; })) - 30;
      minY = Math.min.apply(null, nodes.map(function (n) { return n.y; })) - 30;
      maxX = Math.max.apply(null, nodes.map(function (n) { return n.x + NODE_W; })) + 30;
      maxY = Math.max.apply(null, nodes.map(function (n) { return n.y + NODE_H; })) + 30;
    }
    minX = Math.min(minX, 0); minY = Math.min(minY, 0);
    var svgW = Math.max(maxX - minX, 400), svgH = Math.max(maxY - minY, 160);

    var defs = '<defs><marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
      '<path d="M0,0 L10,5 L0,10 z" fill="var(--dim)"/></marker></defs>';

    var edges = '<g id="flowEdges">' + flowEdgesHTML(nodes) + "</g>";

    var nodesHTML = nodes.map(function (n, idx) {
      var cls = "flow-node" + (idx === 0 ? " start" : idx === nodes.length - 1 ? " end" : "");
      var lines = wrapText(n.text || "단계 " + (idx + 1), 22).slice(0, 2);
      var textHTML = lines.map(function (ln, li) {
        return '<tspan x="' + (NODE_W / 2) + '" y="' + (NODE_H / 2 + (li - (lines.length - 1) / 2) * 15 + 4) + '">' + esc(ln) + "</tspan>";
      }).join("");
      var delBtn = editable ? '<g class="del" data-flow-del="' + esc(n.id) + '" transform="translate(' + (NODE_W - 12) + ',12)">' +
        '<circle r="9"/><text x="0" y="3.5" text-anchor="middle">×</text></g>' : "";
      return '<g class="' + cls + '" data-flow-node="' + esc(n.id) + '" transform="translate(' + n.x + ',' + n.y + ')">' +
        '<rect width="' + NODE_W + '" height="' + NODE_H + '"></rect>' +
        '<text text-anchor="middle">' + textHTML + '</text>' +
        '<text class="idx" x="8" y="14">' + (idx === 0 ? "START" : idx === nodes.length - 1 ? "END" : String(idx).padStart(2, "0")) + '</text>' +
        delBtn + "</g>";
    }).join("");

    var toolbar = editable ?
      '<div class="flow-toolbar"><span class="hint">노드를 드래그해 배치 · 더블클릭으로 텍스트 편집</span>' +
      '<div class="flow-actions"><button class="mini" data-act="flow-add-node" data-id="' + esc(currentFlowProjectId) + '">+ 단계 추가</button>' +
      '<button class="mini" data-act="flow-done" data-id="' + esc(currentFlowProjectId) + '">완료</button></div></div>' : "";

    var svg = nodes.length ? '<svg class="flow-svg" viewBox="' + minX + ' ' + minY + ' ' + svgW + ' ' + svgH + '" width="' + svgW + '" height="' + svgH + '">' +
      defs + edges + nodesHTML + "</svg>" : '<p class="flow-empty">아직 단계가 없습니다.' + (editable ? ' "+ 단계 추가"로 시작해 보세요.' : '') + '</p>';

    return '<div class="flow-wrap' + (editable ? ' editing' : '') + '" id="flowWrap">' + toolbar + svg + "</div>";
  }

  function flowEdgesHTML(nodes) {
    var out = "";
    for (var i = 0; i < nodes.length - 1; i++) {
      var a = nodes[i], b = nodes[i + 1];
      var ax = a.x + NODE_W / 2, ay = a.y + NODE_H;
      var bx = b.x + NODE_W / 2, by = b.y;
      var midY = (ay + by) / 2;
      out += '<path class="flow-edge" marker-end="url(#flowArrow)" d="M' + ax + ',' + ay +
        ' C ' + ax + ',' + midY + ' ' + bx + ',' + midY + ' ' + bx + ',' + by + '"/>';
    }
    return out;
  }

  function wrapText(text, max) {
    var words = String(text).split(/\s+/), lines = [], cur = "";
    words.forEach(function (w) {
      if ((cur + " " + w).trim().length > max && cur) { lines.push(cur); cur = w; }
      else { cur = (cur + " " + w).trim(); }
    });
    if (cur) lines.push(cur);
    return lines.length ? lines : [""];
  }

  // Editing state: which project's flow is in edit mode, and drag tracking.
  var currentFlowProjectId = null;
  var flowDrag = null; // {nodeId, offsetX, offsetY, svg}

  function flowNodePointerDown(ev) {
    var g = ev.target.closest("[data-flow-node]");
    if (!g) return;
    if (ev.target.closest("[data-flow-del]")) return; // let click handler take delete
    var svg = g.closest("svg");
    var pid = currentFlowProjectId;
    var p = pick(S.projects, pid);
    if (!p || !p.roadmapFlow) return;
    var nodeId = g.getAttribute("data-flow-node");
    var node = p.roadmapFlow.nodes.filter(function (n) { return n.id === nodeId; })[0];
    if (!node) return;
    var pt = svgPoint(svg, ev.clientX, ev.clientY);
    flowDrag = { nodeId: nodeId, projectId: pid, offsetX: pt.x - node.x, offsetY: pt.y - node.y, svg: svg };
    ev.preventDefault();
  }
  function svgPoint(svg, clientX, clientY) {
    var rect = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var scaleX = vb.width / rect.width, scaleY = vb.height / rect.height;
    return { x: vb.x + (clientX - rect.left) * scaleX, y: vb.y + (clientY - rect.top) * scaleY };
  }
  document.addEventListener("pointermove", function (ev) {
    if (!flowDrag) return;
    var p = pick(S.projects, flowDrag.projectId);
    if (!p || !p.roadmapFlow) return;
    var node = p.roadmapFlow.nodes.filter(function (n) { return n.id === flowDrag.nodeId; })[0];
    if (!node) return;
    var pt = svgPoint(flowDrag.svg, ev.clientX, ev.clientY);
    node.x = Math.round(pt.x - flowDrag.offsetX);
    node.y = Math.round(pt.y - flowDrag.offsetY);
    var g = flowDrag.svg.querySelector('[data-flow-node="' + flowDrag.nodeId + '"]');

  function parseHash() {

    var parts = raw.split("/").filter(Boolean);

    // «Sessions» 메뉴는 세션 별자리 탭과 겹쳐 뺐다 (2026-11-18 오너 «겹치는 거 없애자») — 예전 주소는 별자리로
    if (v === "sessions") { if (window.top === window) location.replace("/admin/#sessions"); v = "home"; }
    if (!TITLES[v]) v = "home";
    return { view: v, id: parts[1] ? decodeURIComponent(parts[1]) : null };
  }

  function setupRecentDragDrop() {
    var list = document.getElementById("recentList");
    if (!list) return;
    var items = list.querySelectorAll("[data-recent-id]");
    items.forEach(function (item) {
      item.addEventListener("dragstart", function (e) {
        draggedRecentId = item.getAttribute("data-recent-id");
        item.style.opacity = "0.5";
        e.dataTransfer.effectAllowed = "move";
      });
      item.addEventListener("dragend", function (e) {
        item.style.opacity = "1";
        draggedRecentId = null;
      });
      item.addEventListener("dragover", function (e) {
        if (!draggedRecentId) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        var rect = item.getBoundingClientRect();
        if (e.clientY < rect.top + rect.height / 2) {
          list.insertBefore(list.querySelector("[data-recent-id='" + draggedRecentId + "']"), item);
        } else {
          list.insertBefore(list.querySelector("[data-recent-id='" + draggedRecentId + "']"), item.nextSibling);
        }
      });
    });
    list.addEventListener("drop", function (e) {
      if (!draggedRecentId) return;
      e.preventDefault();

          { key: "date", label: "날짜", type: "date", value: ex ? ex.date || "" : today() },
          { key: "name", label: "항목", value: ex ? ex.name : "", placeholder: "예: 촬영용 조명" },
          { key: "category", label: "분류", type: "select", options: SPEND_CATS, value: ex ? ex.category || "기타" : "기타" },
          { key: "amount", label: "금액", type: "number", value: ex ? num(ex.amount) : "" },
          { key: "currency", label: "통화", type: "select", options: CURRENCIES, value: ex ? ex.currency || "KRW" : "KRW" },
          { key: "memo", label: "메모 (선택)", value: ex ? ex.memo || "" : "" }
        ],
        onSave: function (v) {
          if (!v.name.trim()) { toast("항목 이름을 적어 주세요."); return; }
          var t = ex ? pick(S.expenses, ex.id) : { id: uid("exp") };
          if (!t) return;
          t.date = v.date || today(); t.name = v.name.trim(); t.category = v.category;
          t.amount = num(v.amount); t.currency = v.currency; t.memo = v.memo.trim();
          if (!ex) { S.expenses = (S.expenses || []).concat([t]); }
          saveExp(t); render();
        },
        onDelete: ex ? function () {
          openConfirm(ex.name + " 지출을 지울까요?", function () {
            S.expenses = S.expenses.filter(function (x) { return x.id !== ex.id; });
            delDoc("expenses/" + ex.id); render();
          });
        } : null
      });
      return;
    }

    if (act === "ai-edit") {
      var a = S.ai.filter(function (x) { return x.id === id; })[0];
      if (!a) return;
      openEditor({
        title: a.name + " 설정",
        fields: [
          { key: "role", label: "Role", value: a.role },
          { key: "status", label: "Status", type: "select", options: AI_STATES, value: a.status },
          { key: "plan", label: "사용 중인 요금제", value: a.plan || "", placeholder: "예: Free, Pro, Max" },
          { key: "currentWork", label: "Current Work", value: a.currentWork, placeholder: "예: 업무창 개발" },
          { key: "subscriptionDate", label: "구독일", type: "date", value: a.subscriptionDate || "", hint: "결제 주기에 따라 다음 결제일을 계산합니다." },
          { key: "cycle", label: "결제 주기", type: "select", options: ["매월", "매년"], value: CYCLES[a.cycle] || "매월" },
          { key: "amount", label: "회당 금액", type: "number", value: num(a.amount), placeholder: "예: 100" },
          { key: "currency", label: "통화", type: "select", options: CURRENCIES, value: a.currency || "KRW" },
          { key: "responsibilities", label: "주요 책임", value: (a.responsibilities || []).join(", "), hint: "쉼표로 구분합니다." }
        ],
        onSave: function (v) {
          var t = pick(S.ai, id);
          if (!t) return;
          t.role = v.role.trim() || t.role; t.status = v.status; t.plan = v.plan.trim();
          t.currentWork = v.currentWork.trim(); t.subscriptionDate = v.subscriptionDate || "";
          t.cycle = v.cycle === "매년" ? "yearly" : "monthly"; t.amount = num(v.amount); t.currency = v.currency;
          t.responsibilities = v.responsibilities.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
          saveAI(t); render();
        }
      });
      return;
    }

    if (act === "company-block") {
      var ck = el.getAttribute("data-key");
      openEditor({
        title: el.getAttribute("data-label"),
        fields: [{ key: "v", label: el.getAttribute("data-label"), type: "textarea", value: S.company[ck], hint: "Markdown을 사용할 수 있습니다." }],
        onSave: function (v) { S.company[ck] = v.v; saveCompany(); render(); }
      });
      return;
    }
    if (act === "rule-new") {
      openEditor({
        title: "규칙 추가",
        fields: [
          { key: "title", label: "제목", value: "" },
          { key: "body", label: "내용", type: "textarea", value: "" }
        ],
        onSave: function (v) {
          if (!v.title.trim()) return;
          S.rules.items.push({ id: uid("u"), title: v.title.trim(), body: v.body });
          saveRules(); render();
        }
      });
      return;
    }
    if (act === "rule-open") {
      var ru = S.rules.items.filter(function (x) { return x.id === id; })[0];
      if (!ru) return;
      openEditor({
        title: ru.title,
        fields: [
          { key: "title", label: "제목", value: ru.title },
          { key: "body", label: "내용", type: "textarea", value: ru.body, hint: "Markdown을 사용할 수 있습니다." }
        ],
        onSave: function (v) {
          var t = pick(S.rules.items, id);
          if (!t) return;
          t.title = v.title.trim() || t.title; t.body = v.body; saveRules(); render();
        },
        onDelete: function () {
          openConfirm(ru.title + " 규칙을 삭제할까요?", function () {
            S.rules.items = S.rules.items.filter(function (x) { return x.id !== id; });
            saveRules(); render();
          });
        }
      });
      return;
    }

    if (act === "k-new" || act === "k-edit") {
      var k = act === "k-edit" ? S.knowledge.filter(function (x) { return x.id === id; })[0] : null;
      if (k && k.term) {
        // Glossary term editor
        var displayTitle = (k.term_en || k.term) + (k.term_ko ? " (" + k.term_ko + ")" : "");
        openEditor({
          title: "용어 편집: " + displayTitle,
          fields: [
            { key: "term_en", label: "용어 (영어)", value: k.term_en || "" },
            { key: "term_ko", label: "용어 (한글)", value: k.term_ko || "" },
            { key: "definition", label: "정의", value: k.body }
          ],
          translatePair: ["term_en", "term_ko"],
          onSave: function (v) {
            if (!v.term_en.trim() && !v.term_ko.trim()) return;
            var t = pick(S.knowledge, k.id);
            if (!t) return;
            var newDisplay = v.term_en.trim() || v.term_ko.trim();
            t.term_en = v.term_en.trim(); t.term_ko = v.term_ko.trim();
            t.term = newDisplay; t.title = newDisplay; t.body = v.definition; t.updatedAt = today();
            saveKnowledge(t); render();
          },
          onDelete: function () {
            openConfirm("'" + displayTitle + "' 용어를 삭제할까요?", function () {
              S.knowledge = S.knowledge.filter(function (x) { return x.id !== k.id; });
              delDoc("knowledge/" + k.id); location.hash = "#/knowledge"; render();
            });
          }
        });
      } else {
        // Regular document editor
        openEditor({
          title: k ? "문서 편집" : "새 지식 문서",
          fields: [
            { key: "title", label: "제목", value: k ? k.title : "" },
            { key: "category", label: "카테고리", type: "select", options: CATS, value: k ? k.category : "Guides" },
            { key: "body", label: "내용", type: "textarea", value: k ? k.body : "", hint: "Markdown으로 저장됩니다." }
          ],
          onSave: function (v) {
            if (!v.title.trim()) return;
            if (k) {
              var t = pick(S.knowledge, k.id);
              if (!t) return;
              t.title = v.title.trim(); t.category = v.category; t.body = v.body; t.updatedAt = today();
              saveKnowledge(t); render();
            } else {
              var nk = { id: uid("k"), title: v.title.trim(), category: v.category, body: v.body, updatedAt: today() };
              S.knowledge.push(nk); saveKnowledge(nk); location.hash = "#/knowledge/" + encodeURIComponent(nk.id);
            }
          },
          onDelete: k ? function () {
            openConfirm(k.title + " 문서를 삭제할까요? 되돌릴 수 없습니다.", function () {
              S.knowledge = S.knowledge.filter(function (x) { return x.id !== k.id; });
              delDoc("knowledge/" + k.id); location.hash = "#/knowledge"; render();
            });
          } : null
        });
      }
      return;
    }

    if (act === "settings-general") {
      openEditor({
        title: "General",
        fields: [
          { key: "name", label: "회사 이름", value: S.company.name },
          { key: "short", label: "약칭", value: S.company.short },
          { key: "status", label: "회사 상태", value: S.company.status, hint: "예: OPERATING, PAUSED" },
          { key: "focus", label: "현재 집중 프로젝트", value: S.company.focus }
        ],
        onSave: function (v) {
          S.company.name = v.name.trim() || S.company.name;
          S.company.short = v.short.trim() || S.company.short;
          S.company.status = v.status.trim().toUpperCase() || S.company.status;
          S.company.focus = v.focus.trim();
          saveCompany(); render();
        }
      });
      return;
    }

    if (act === "export") { doExport(); return; }
    if (act === "import") {
      openEditor({
        title: "JSON 가져오기",
        fields: [{ key: "json", label: "내보낸 JSON", type: "textarea", value: "", hint: "붙여넣은 내용으로 전체를 덮어씁니다." }],
        saveLabel: "복원",
        onSave: function (v) { doImport(v.json); }
      });
      return;
    }
  });

  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.getAttribute && el.getAttribute("data-act") === "ai-status") {
      var a = S.ai.filter(function (x) { return x.id === el.getAttribute("data-id"); })[0];
      if (!a) return;
      a.status = el.value;
      saveAI(a).then(function () { toast(a.name + " 상태를 " + a.status + "(으)로 바꿨습니다."); });
      render();
    }
  });

  /* ============ export / import ============ */
  function doExport() {
    var payload = JSON.stringify({
      exportedAt: new Date().toISOString(), version: 1,
      company: S.company, settings: S.settings, recent: S.recent,
      rules: S.rules, projects: S.projects, ai: S.ai, knowledge: S.knowledge,
      subs: S.subs, expenses: S.expenses, accounts: S.accounts
    }, null, 2);
    var filename = "wmw-hq-" + today() + ".json";
    if (!downloads) {
      openEditor({
        title: "내보내기 (복사용)",
        fields: [{ key: "j", label: filename, type: "textarea", value: payload }],
        saveLabel: "닫기", onSave: function () {}
      });
      return;
    }
    downloads.save({ filename: filename, data: payload }).then(function () {
      toast("내보냈습니다: " + filename);
    }).catch(function (e) {
      if (e && e.code === "declined") return;
      toast("파일을 저장하지 못했습니다.");
    });
  }

  function doImport(raw) {
    var v;
    try { v = JSON.parse(raw); } catch (e) { toast("JSON 형식이 올바르지 않습니다."); return; }
    ["company", "settings", "recent", "rules", "projects", "ai", "knowledge", "subs", "expenses", "accounts"].forEach(function (k) {
      if (v && v[k]) S[k] = v[k];
    });
    applyTheme();
    saveLocal();
    pushAll().then(function () { toast("복원했습니다."); render(); });
  }

  function pushAll() {
    var jobs = [
      putDoc("site/company", S.company), putDoc("site/settings", S.settings),
      putDoc("site/recent", { items: S.recent.items }), putDoc("site/rules", { items: S.rules.items })
    ];
    S.projects.forEach(function (p) { jobs.push(putDoc("projects/" + p.id, p)); });
    S.ai.forEach(function (a) { jobs.push(putDoc("ai/" + a.id, a)); });
    S.knowledge.forEach(function (k) { jobs.push(putDoc("knowledge/" + k.id, k)); });
    (S.subs || []).forEach(function (x) { jobs.push(putDoc("subs/" + x.id, x)); });
    (S.expenses || []).forEach(function (x) { jobs.push(putDoc("expenses/" + x.id, x)); });
    if (S.accounts && S.accounts.items) jobs.push(saveAccounts());
    return Promise.all(jobs);
  }

  /* ============ theme + clock ============ */
  function applyTheme() {
    if (S.settings.theme === "light") document.documentElement.setAttribute("data-wmw", "light");
    else document.documentElement.setAttribute("data-wmw", "dark");
  }

  function tickClock() {
    var el = document.getElementById("clock");
    if (el) {
      el.textContent = new Date().toLocaleTimeString("ko-KR", {
        hour12: false, timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }
  }
  setInterval(tickClock, 1000);
  tickClock();

  function setConn(ok, label) {
    var d = document.getElementById("connDot"), t = document.getElementById("connText");
    if (d) d.className = "dot " + (ok ? "ok" : "warn");
    if (t) t.textContent = label;
  }

  /* ============ store wiring ============ */
  // Snapshot bodies arrive frozen — always take a writable copy before it
  // reaches state, or every later edit throws under strict mode.
  function watchCollection(path, key) {
    db.collection(path).onSnapshot(function (snap) {
      S[key] = snap.docs.map(function (d) {
        var o = clone(d.data() || {});
        o.id = d.id;
        return o;
      });
      saveLocal();
      if (ready) render();
    }, function (e) { toast(dbMsg(e)); });
  }

  function connect() {
    if (!window.claude || !window.claude.use) { setConn(false, "로컬 전용"); return; }
    window.claude.use("db").then(function (d) {
      if (!d) { setConn(false, "로컬 전용"); return; }
      db = d;
      setConn(true, "저장소 연결됨");
      // Decisions first: the open/closed state of every decision depends on it. Its failure is shown,
      // never swallowed — an empty DEC silently made ~100 closed decisions look open again (2026-10-09).
      db.collection("decisions").onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { if (d.exists) next[d.id] = clone(d.data() || {}); });
        DEC = next; DEC_LOAD = { ok: true, n: snap.docs.length };
        if (ready) renderKeepingFocus();
      }, function (e) {
        DEC_LOAD = { ok: false, code: (e && (e.code || e.message)) || "unknown" };
        if (ready) render();
      });
      // One listener for the four site/* docs instead of four (fewer live listeners on the page).
      db.collection("site").onSnapshot(function (snap) {
        snap.docs.forEach(function (d) {
          if (!d.exists) return;
          var v = clone(d.data() || {});
          if (d.id === "company") S.company = v;
          else if (d.id === "settings") { S.settings = v; applyTheme(); }
          else if (d.id === "recent") S.recent = { items: v.items || [] };
          else if (d.id === "rules") S.rules = { items: v.items || [] };
          else if (d.id === "accounts") S.accounts = { items: v.items || [] };
        });
        saveLocal();
        if (ready) render();
      }, function (e) { toast(dbMsg(e)); });
      watchCollection("projects", "projects");
      watchCollection("ai", "ai");
      watchCollection("knowledge", "knowledge");
      watchCollection("subs", "subs");
      watchCollection("expenses", "expenses");
      db.collection("feed").onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { if (d.exists) next[d.id] = clone(d.data() || {}); });
        F = next;
        if (ready) renderKeepingFocus();
      }, function () {});
      db.collection("session_subs").onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { if (d.exists) { var v = clone(d.data() || {}); if (v.key) next[v.key] = v; } });
        SUBS_DOC = next;
        if (ready) renderKeepingFocus();
      }, function () {});
      db.collection("session_groups").onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) { if (d.exists) next[d.id] = clone(d.data() || {}); });
        SG = next;
        if (ready) renderKeepingFocus();
      }, function () {});
      if (ready) render();
    }).catch(function () { setConn(false, "로컬 전용"); });

    window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () {});
    window.claude.use("comments").then(function (c) { comments = c; refreshSend(); }).catch(function () {});
  }

  /* ============ zoom ============ */
  function applyZoom() {
    document.body.style.zoom = zoomLevel;
  }
  document.addEventListener("wheel", function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    zoomLevel += e.deltaY < 0 ? 0.1 : -0.1;
    zoomLevel = Math.max(0.8, Math.min(1.5, zoomLevel));
    applyZoom();
    localStorage.setItem("wmw-zoom", zoomLevel);
    pushHistoryState();
  });

  /* ============ boot ============ */
  loadLocal();
  zoomLevel = parseFloat(localStorage.getItem("wmw-zoom")) || 1;
  applyTheme();
  applyZoom();
  route = parseHash();
  if (!location.hash && S.settings.home && S.settings.home !== "home") {
    route = { view: S.settings.home, id: null };
  }
  render();
  pushHistoryState(true);
  ready = true;
  connect();
})();
</script>

</body></html>
