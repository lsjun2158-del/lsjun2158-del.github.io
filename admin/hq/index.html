<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WELMAWORLD HQ</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="hq-firebase.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#000000;
  --surface:#0B0A10;
  --raised:#131019;
  --line:#241F30;
  --line-soft:#191524;
  --text:#ECE8F2;
  --muted:#877F97;
  --dim:#5C5570;
  --accent:#8257FF;
  --accent-soft:#B79CFF;
  --accent-wash:rgba(130,87,255,.13);
  --accent-line:rgba(130,87,255,.34);
  --wander:#000000;
  --make:#8257FF;
  --wing:#8B3A3A;
  --wing-soft:#D4677D;
  --ok:#46D9A0;
  --warn:#F0B845;
  --bad:#FF6B6B;
  --off:#5C5570;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --display:"Archivo","IBM Plex Sans KR",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
:root[data-wmw="light"]{
  color-scheme: light;
  --bg:#FAF9FC;
  --surface:#FFFFFF;
  --raised:#FFFFFF;
  --line:#E4DFEE;
  --line-soft:#EFEBF6;
  --text:#16121F;
  --muted:#6A6280;
  --dim:#948CA8;
  --accent:#6534E8;
  --accent-soft:#5327D6;
  --accent-wash:rgba(101,52,232,.08);
  --accent-line:rgba(101,52,232,.22);
  --ok:#12A46E;
  --warn:#B47908;
  --bad:#D23B3B;
  --off:#948CA8;
  --shadow:0 1px 2px rgba(22,18,31,.05);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:216px minmax(0,1fr); min-height:100vh}

.rail{
  border-right:1px solid var(--line); background:var(--surface);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.mark{padding:26px 22px 22px; border-bottom:1px solid var(--line-soft)}
.mark b{
  display:block; font-family:var(--display); font-weight:800; font-size:15px;
  letter-spacing:.13em; line-height:1.2;
}
.mark span{
  display:block; margin-top:6px; font-family:var(--mono); font-size:10px;
  letter-spacing:.18em; color:var(--dim); text-transform:uppercase;
}
.menu{display:flex; flex-direction:column; padding:14px 0; gap:1px; flex:1; overflow-y:auto}
.menu a{
  display:flex; align-items:center; gap:10px; padding:9px 22px;
  font-family:var(--display); font-weight:600; font-size:12px; letter-spacing:.11em;
  text-transform:uppercase; color:var(--muted); text-decoration:none;
  border-left:2px solid transparent;
}
.menu a:hover{color:var(--text); background:var(--line-soft)}
.menu a[aria-current="page"]{color:var(--text); border-left-color:var(--accent); background:var(--accent-wash)}
.menu a i{font-style:normal; font-family:var(--mono); font-size:10px; color:var(--dim)}
.menu a[aria-current="page"] i{color:var(--accent-soft)}
.rail-foot{
  padding:16px 22px; border-top:1px solid var(--line-soft);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--dim);
  display:flex; flex-direction:column; gap:5px;
}
.rail-foot .conn{display:flex; align-items:center; gap:6px}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:baseline; justify-content:space-between; gap:16px;
  padding:24px 34px 18px; border-bottom:1px solid var(--line);
}
.topbar h1{
  margin:0; font-family:var(--display); font-weight:700; font-size:20px;
  letter-spacing:.1em; text-transform:uppercase;
}
.topbar .sub{margin:4px 0 0; color:var(--muted); font-size:12.5px}
.clock{font-family:var(--mono); font-size:11px; letter-spacing:.09em; color:var(--dim); white-space:nowrap; text-align:right}
.clock b{display:block; color:var(--muted); font-weight:500; font-size:12.5px; font-variant-numeric:tabular-nums}
.view{padding:30px 34px 72px; max-width:1160px; width:100%}

/* ---------- shared bits ---------- */
.eyebrow{
  font-family:var(--display); font-weight:700; font-size:10.5px; letter-spacing:.19em;
  text-transform:uppercase; color:var(--dim);
}
.sec{margin-top:38px}
.sec:first-child{margin-top:0}
.sec-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-bottom:10px; margin-bottom:16px; border-bottom:1px solid var(--line);
}
.mini{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--muted);
  border:1px solid var(--line); border-radius:3px; padding:4px 9px;
}
.mini:hover{border-color:var(--accent-line); color:var(--accent-soft); background:var(--accent-wash)}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block; flex:none; background:var(--off)}
.dot.ok{background:var(--ok); box-shadow:0 0 0 3px rgba(70,217,160,.14)}
.dot.warn{background:var(--warn); box-shadow:0 0 0 3px rgba(240,184,69,.14)}
.dot.idle{background:transparent; border:1.5px solid var(--dim)}
.dot.live{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.state{
  display:inline-flex; align-items:center; gap:7px; font-family:var(--mono);
  font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted);
}
.empty{color:var(--dim); font-size:13px; padding:14px 0}

/* ---------- home: status band ---------- */
.band{
  border:1px solid var(--line); border-radius:6px; background:var(--surface);
  box-shadow:var(--shadow); overflow:hidden;
}
.band-top{
  display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
  gap:20px; padding:24px 26px 20px;
}
.band-top h2{
  margin:8px 0 0; font-family:var(--display); font-weight:800; font-size:34px;
  letter-spacing:.03em; line-height:1;
}
.band-top .op{display:flex; align-items:center; gap:11px}
.band-note{color:var(--muted); font-size:12.5px; max-width:46ch; margin:10px 0 0}
.stats{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  border-top:1px solid var(--line-soft);
}
.stat{padding:16px 26px; border-left:1px solid var(--line-soft)}
.stat:first-child{border-left:none}
.stat .k{font-family:var(--mono); font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim)}
.stat .v{
  margin-top:5px; font-family:var(--display); font-weight:700; font-size:23px;
  letter-spacing:.02em; font-variant-numeric:tabular-nums;
}
.stat .v.small{font-size:17px; font-family:var(--sans); font-weight:600; letter-spacing:0}
.stat .v.small em{font-style:normal; color:var(--accent-soft)}

.split{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:34px; margin-top:38px}

/* ---------- project cards ---------- */
.pcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.pcard{
  text-align:left; width:100%; border:1px solid var(--line); border-radius:6px;
  background:var(--surface); padding:18px 18px 16px; display:flex; flex-direction:column;
  gap:12px; box-shadow:var(--shadow);
}
.pcard:hover{border-color:var(--accent-line)}
.pcard h3{margin:0; font-size:16px; font-weight:600; letter-spacing:-.01em}
.pcard .desc{margin:0; color:var(--muted); font-size:12.5px}
.bar{display:flex; gap:3px; align-items:center}
.bar i{height:7px; flex:1; border-radius:1px; background:var(--line); font-style:normal}
.bar i.on{background:var(--accent)}
.bar b{
  font-family:var(--mono); font-size:11px; font-weight:500; margin-left:7px;
  font-variant-numeric:tabular-nums; color:var(--accent-soft);
}
.prow{display:flex; align-items:center; justify-content:space-between; gap:10px}

/* ---------- ai rows ---------- */
.airows{display:flex; flex-direction:column}
.airow{
  display:flex; align-items:flex-start; gap:14px; padding:14px 2px;
  border-bottom:1px solid var(--line-soft);
}
.airow:last-child{border-bottom:none}
.airow .who{min-width:82px}
.airow .who b{display:block; font-family:var(--display); font-weight:700; font-size:14px; letter-spacing:.04em}
.airow .who span{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim)}
.airow .work{flex:1; min-width:0}
.airow .work p{margin:4px 0 0; font-size:13px; color:var(--muted); word-break:break-word}

/* ---------- recent ---------- */
.rlist{display:flex; flex-direction:column}
.ritem{
  display:flex; gap:18px; align-items:baseline; padding:11px 2px;
  border-bottom:1px solid var(--line-soft);
}
.ritem time{
  font-family:var(--mono); font-size:11.5px; color:var(--dim); flex:none;
  font-variant-numeric:tabular-nums; letter-spacing:.03em;
}
.ritem p{margin:0; flex:1; font-size:13.5px}
.ritem button{color:var(--dim); font-family:var(--mono); font-size:11px; opacity:0; flex:none}
.ritem:hover button{opacity:1}
.ritem button:hover{color:var(--warn)}

/* ---------- detail / docs ---------- */
.detail-head{display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:16px}
.detail-head h2{margin:0; font-size:26px; font-weight:600; letter-spacing:-.02em}
.facts{display:flex; flex-wrap:wrap; gap:26px; margin-top:18px; padding-bottom:22px; border-bottom:1px solid var(--line)}
.fact .k{font-family:var(--mono); font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim)}
.fact .v{margin-top:4px; font-size:15px; font-weight:500}
.blocks{display:flex; flex-direction:column; gap:2px; margin-top:8px}
.block{padding:20px 0; border-bottom:1px solid var(--line-soft)}
.block-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px}
.prose{font-size:13.5px; color:var(--text)}
.prose p{margin:0 0 .7em}
.prose h1,.prose h2,.prose h3{
  font-family:var(--display); font-weight:700; letter-spacing:.02em;
  margin:1.3em 0 .5em; line-height:1.3; text-wrap:balance;
}
.prose h1{font-size:18px} .prose h2{font-size:16px} .prose h3{font-size:14px}
.prose ul,.prose ol{margin:0 0 .8em; padding-left:1.15em}
.prose li{margin:.2em 0}
.prose code{
  font-family:var(--mono); font-size:.87em; background:var(--line-soft);
  border:1px solid var(--line); border-radius:3px; padding:.08em .35em;
}
.prose pre{
  font-family:var(--mono); font-size:12px; background:var(--line-soft);
  border:1px solid var(--line); border-radius:5px; padding:13px 15px; overflow-x:auto;
}
.prose pre code{background:none; border:none; padding:0}
.prose blockquote{
  margin:0 0 .8em; padding:2px 0 2px 14px; border-left:2px solid var(--accent-line); color:var(--muted);
}
.prose hr{border:none; border-top:1px solid var(--line); margin:1.3em 0}
.tree{
  font-family:var(--mono); font-size:12.5px; line-height:1.85; color:var(--muted);
  border:1px solid var(--line); border-radius:6px; background:var(--surface);
  padding:20px 22px; overflow-x:auto; margin:0; white-space:pre;
}
.tree b{color:var(--text); font-weight:600}
.tree u{color:var(--accent-soft); text-decoration:none}

/* ---------- flowchart (roadmap workflow) ---------- */
.flow-wrap{
  border:1px solid var(--line); border-radius:6px; background:var(--surface);
  overflow:auto; position:relative;
}
.flow-wrap.editing{border-color:var(--accent-line); cursor:default}
.flow-toolbar{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 12px; border-bottom:1px solid var(--line-soft); background:var(--raised);
  position:sticky; top:0; z-index:2;
}
.flow-toolbar .hint{font-size:11.5px; color:var(--dim)}
.flow-actions{display:flex; gap:8px}
.flow-svg{display:block; touch-action:none}
.flow-node rect{
  fill:var(--raised); stroke:var(--line); stroke-width:1.5; rx:8;
}
.flow-node.start rect{fill:var(--accent-wash); stroke:var(--accent-line)}
.flow-node.end rect{fill:rgba(70,217,160,.10); stroke:rgba(70,217,160,.4)}
.flow-node text{
  fill:var(--text); font-family:var(--sans); font-size:12.5px; font-weight:500;
  pointer-events:none; user-select:none;
}
.flow-node .idx{
  fill:var(--dim); font-family:var(--mono); font-size:9.5px; letter-spacing:.08em;
  pointer-events:none; user-select:none;
}
.flow-node{cursor:grab}
.flow-node:active{cursor:grabbing}
.flow-node .del{cursor:pointer; opacity:0}
.flow-node:hover .del{opacity:1}
.flow-node .del circle{fill:var(--surface); stroke:var(--line)}
.flow-node .del text{fill:var(--warn); font-family:var(--mono); font-size:11px; pointer-events:none}
.flow-node .del:hover circle{stroke:var(--warn)}
.flow-edge{fill:none; stroke:var(--line); stroke-width:1.75}
.flow-empty{padding:40px 20px; text-align:center; color:var(--dim); font-size:13px}

/* ---------- ai cards (AI view) ---------- */
.aigrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(268px,1fr)); gap:14px}
.aicard{
  border:1px solid var(--line); border-radius:6px; background:var(--surface);
  padding:19px 20px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow);
}
.aicard header{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.aicard h3{margin:0; font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.05em}
.aicard .role{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-top:3px}
.tags{display:flex; flex-wrap:wrap; gap:5px}
.tag{
  font-size:11px; padding:3px 8px; border-radius:3px; color:var(--muted);
  border:1px solid var(--line); background:var(--line-soft);
}
.cw{border-top:1px solid var(--line-soft); padding-top:12px}
.cw .k{font-family:var(--mono); font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim)}
.cw p{margin:3px 0 0; font-size:13px}
select.sel{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--raised); color:var(--muted); border:1px solid var(--line);
  border-radius:3px; padding:4px 6px;
}

/* ---------- knowledge ---------- */
.kbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px}
.search{
  flex:1; min-width:180px; display:flex; align-items:center; gap:8px;
  border:1px solid var(--line); border-radius:4px; padding:7px 11px; background:var(--surface);
}
.search input{flex:1; background:none; border:none; color:var(--text); font:inherit; font-size:13px; outline:none}
.search span{font-family:var(--mono); font-size:11px; color:var(--dim)}
.cats{display:flex; flex-wrap:wrap; gap:5px}
.cats button{
  font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  padding:5px 10px; border:1px solid var(--line); border-radius:3px; color:var(--muted);
}
.cats button[aria-pressed="true"]{color:var(--accent-soft); border-color:var(--accent-line); background:var(--accent-wash)}
.klist{display:flex; flex-direction:column}
.kitem{
  display:flex; align-items:baseline; gap:16px; width:100%; text-align:left;
  padding:14px 2px; border-bottom:1px solid var(--line-soft);
}
.kitem:hover{background:var(--line-soft)}
.kitem .cat{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--accent-soft); flex:none; width:88px;
}
.kitem .t{flex:1; font-size:14px; font-weight:500; min-width:0}
.kitem .t span{display:block; font-weight:400; font-size:12.5px; color:var(--muted); margin-top:2px}
.kitem time{font-family:var(--mono); font-size:11px; color:var(--dim); flex:none; font-variant-numeric:tabular-nums}
.glist{display:flex; flex-direction:column}
.gitem{
  display:grid; grid-template-columns:180px minmax(0,1fr); gap:18px; align-items:baseline;
  width:100%; text-align:left; padding:12px 2px; border-bottom:1px solid var(--line-soft);
  background:none; text-decoration:none; color:inherit; cursor:pointer;
}
.gitem:hover{background:var(--line-soft)}
.gitem .gt{font-weight:600; font-size:14px; color:var(--accent-soft); font-family:var(--mono)}
.gitem .gd{font-size:13px; color:var(--muted); word-break:break-word; white-space:normal}

/* ---------- settings ---------- */
.rows{border-top:1px solid var(--line-soft)}
.srow{
  display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;
  padding:15px 2px; border-bottom:1px solid var(--line-soft);
}
.srow .l{min-width:200px}
.srow .l b{display:block; font-size:13.5px; font-weight:500}
.srow .l span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}
.srow .r{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; color:var(--muted)}
.seg{display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.seg button{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  padding:6px 13px; color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--accent-wash); color:var(--accent-soft)}

/* ---------- modal / toast ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:40;
  display:flex; align-items:flex-start; justify-content:center; padding:44px 18px; overflow-y:auto;
}
.sheet{
  width:100%; max-width:640px; background:var(--raised); border:1px solid var(--line);
  border-radius:8px; box-shadow:0 24px 64px rgba(0,0,0,.5);
}
.sheet header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:18px 22px; border-bottom:1px solid var(--line);
}
.sheet header h3{margin:0; font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.13em; text-transform:uppercase}
.sheet .body{padding:20px 22px; display:flex; flex-direction:column; gap:16px}
.sheet footer{display:flex; justify-content:flex-end; gap:9px; padding:16px 22px; border-top:1px solid var(--line)}
.field label{
  display:block; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim); margin-bottom:6px;
}
.field input,.field textarea,.field select{
  width:100%; background:var(--surface); color:var(--text); font:inherit; font-size:13.5px;
  border:1px solid var(--line); border-radius:4px; padding:9px 11px; outline:none;
}
.field textarea{min-height:150px; resize:vertical; font-family:var(--mono); font-size:12.5px; line-height:1.65}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent-line)}
.field .hint{font-size:11.5px; color:var(--dim); margin-top:5px}
.btn{
  font-family:var(--display); font-weight:600; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; padding:9px 16px; border-radius:4px; border:1px solid var(--line);
  color:var(--muted);
}
.btn:hover{color:var(--text)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{color:#fff; filter:brightness(1.1)}
.btn.danger:hover{color:var(--warn); border-color:var(--warn)}
#toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60;
  background:var(--raised); border:1px solid var(--accent-line); border-radius:5px;
  padding:10px 18px; font-size:12.5px; box-shadow:0 12px 32px rgba(0,0,0,.45); max-width:82vw;
}

/* ---------- feed: shared ---------- */
.asof{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--muted); white-space:nowrap}
.asof.stale{opacity:.45}
.sysbar{
  display:flex; gap:10px; align-items:flex-start; padding:11px 14px; margin-bottom:10px;
  border:1px solid rgba(240,184,69,.35); background:rgba(240,184,69,.07); border-radius:6px; font-size:12.5px;
}
.sysbar b{color:var(--warn); font-weight:600; flex:none}
.sysbar span{color:var(--muted); min-width:0; word-break:break-word}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chips button{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; padding:5px 10px;
  border:1px solid var(--line); border-radius:3px; color:var(--muted);
}
.chips button[aria-pressed="true"]{color:var(--accent-soft); border-color:var(--accent-line); background:var(--accent-wash)}
.chips button em{font-style:normal; color:var(--warn); margin-left:5px}
.pchip{
  font-family:var(--mono); font-size:10px; letter-spacing:.04em; color:var(--accent-soft);
  border:1px solid var(--accent-line); border-radius:3px; padding:1px 6px; white-space:nowrap; flex:none;
}
.kd{width:7px; height:7px; border-radius:50%; flex:none; display:inline-block; background:var(--off)}
.kd.done{background:var(--ok)} .kd.decide{background:var(--warn)} .kd.fail{background:var(--bad)}
.menu a .nb{
  margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--warn);
  border:1px solid rgba(240,184,69,.4); border-radius:9px; padding:0 6px; line-height:16px;
}
.menu a .nb:empty{display:none}

/* ---------- feed: project cards ---------- */
.fcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px}
.fcard{
  text-align:left; width:100%; border:1px solid var(--line); border-radius:6px; background:var(--surface);
  padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); min-width:0;
}
.fcard:hover{border-color:var(--accent-line)}
.fcard .top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.fcard h3{margin:0; font-size:15px; font-weight:600}
.fcard .ver{font-family:var(--mono); font-size:11px; color:var(--accent-soft); white-space:nowrap}
.fcard .warnchip{font-size:11px; color:var(--warn)}
.fcard .nochip{font-size:11px; color:var(--dim)}
.metrics{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; border-top:1px solid var(--line-soft); padding-top:10px}
.metrics div{min-width:0}
.metrics .k{font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--dim); white-space:nowrap}
.metrics .v{font-family:var(--display); font-weight:700; font-size:17px; font-variant-numeric:tabular-nums}
.metrics .v.hot{color:var(--warn)}
.lastc{font-size:12px; color:var(--muted); min-width:0}
.lastc code{font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-right:6px}
.lastc p{margin:0; word-break:break-word}
.lastc time{display:block; font-family:var(--mono); font-size:10px; color:var(--dim); margin-top:3px}

/* ---------- decisions ---------- */
.dlist{display:flex; flex-direction:column}
.ditem{padding:14px 2px; border-bottom:1px solid var(--line-soft); display:flex; flex-direction:column; gap:8px}
.ditem .meta{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.ditem .task{margin:0; font-size:14px; word-break:break-word}
.ditem .fu{margin:0; font-size:12.5px; color:var(--muted); word-break:break-word}
.ditem .fu::before{content:"→ "; color:var(--dim)}
.ditem .done-note{font-size:12.5px; color:var(--muted)}
.dact{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.dact input{
  flex:1 1 200px; min-width:0; background:var(--surface); color:var(--text); font:inherit; font-size:12.5px;
  border:1px solid var(--line); border-radius:4px; padding:6px 9px; outline:none;
}
.dact input:focus{border-color:var(--accent-line)}
.dbtn{
  font-family:var(--mono); font-size:11px; padding:5px 11px; border-radius:3px; border:1px solid var(--line); color:var(--muted); flex:none;
}
.dbtn.ok:hover{color:var(--ok); border-color:var(--ok)}
.dbtn.later:hover{color:var(--warn); border-color:var(--warn)}
.dbtn.drop:hover{color:var(--bad); border-color:var(--bad)}
.dstate{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase}
.dstate.decided{color:var(--ok)} .dstate.later{color:var(--warn)} .dstate.dropped{color:var(--bad)}

/* ---------- flow ---------- */
.heat{display:grid; gap:3px; grid-template-columns:var(--lw,104px) repeat(var(--n,21),minmax(0,1fr)); align-items:center}
.heat .lbl{font-size:11.5px; line-height:1.25; color:var(--muted); overflow-wrap:anywhere; padding-right:6px}
.heat .lbl.tot{color:var(--text); font-weight:600}
.heat .dh{font-family:var(--mono); font-size:9px; color:var(--dim); text-align:center; overflow:hidden}
.heat .c{aspect-ratio:1/1; border-radius:2px; background:var(--line-soft); min-width:0}
.heat .c.l1{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.heat .c.l2{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.heat .c.l3{background:color-mix(in srgb,var(--accent) 75%,transparent)}
.heat .c.l4{background:var(--accent)}
.heat .c.wk{outline:1px solid var(--line); outline-offset:-1px}
.legend{display:flex; align-items:center; gap:4px; font-family:var(--mono); font-size:10px; color:var(--dim); margin-top:10px; justify-content:flex-end}
.legend i{width:11px; height:11px; border-radius:2px; display:inline-block}
.tl{display:flex; flex-direction:column}
.tlrow{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; padding:9px 2px; border-bottom:1px solid var(--line-soft)}
.tlrow .kd{align-self:center}
.tlrow time{font-family:var(--mono); font-size:11px; color:var(--dim); flex:none; font-variant-numeric:tabular-nums}
.tlrow p{margin:0; flex:1 1 240px; min-width:0; font-size:13px; word-break:break-word}
.rel{display:flex; flex-direction:column; gap:14px}
.relrow{display:flex; flex-direction:column; gap:7px}
.relrow .h{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.relrow .h b{font-size:13px; font-weight:600}
.relrow .h time{font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.tags2{display:flex; flex-wrap:wrap; align-items:center; gap:4px}
.tags2 span{font-family:var(--mono); font-size:10.5px; padding:2px 7px; border:1px solid var(--line); border-radius:3px; color:var(--muted)}
.tags2 span.last{color:var(--accent-soft); border-color:var(--accent-line); background:var(--accent-wash)}
.tags2 i{font-style:normal; color:var(--dim); font-size:10px}

/* ---------- ai: sessions & usage ---------- */
.gauges{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.gauge{border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:14px 16px}
.gauge .h{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.gauge .h b{font-size:12.5px; font-weight:600}
.gauge .h span{font-family:var(--display); font-weight:700; font-size:20px; font-variant-numeric:tabular-nums}
.gauge .track{height:6px; background:var(--line-soft); border-radius:3px; margin:9px 0 8px; overflow:hidden}
.gauge .track i{display:block; height:100%; background:var(--accent); border-radius:3px}
.gauge.hot .track i{background:var(--warn)} .gauge.hot .h span{color:var(--warn)}
.gauge p{margin:0; font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.sess{display:flex; flex-direction:column}
.srow2{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line-soft); min-width:0}
.srow2 .t{flex:1; min-width:0}
.srow2 .t b{display:block; font-size:13.5px; font-weight:500; word-break:break-word}
.srow2 .t span{display:block; font-size:11.5px; color:var(--dim)}
.srow2 time{font-family:var(--mono); font-size:10.5px; color:var(--dim); flex:none}

/* ---------- prose tables ---------- */
.tblwrap{overflow-x:auto; margin:0 0 .9em; border:1px solid var(--line); border-radius:5px}
.prose table{border-collapse:collapse; width:100%; font-size:12.5px}
.prose th,.prose td{padding:7px 10px; border-bottom:1px solid var(--line-soft); text-align:left; vertical-align:top}
.prose th{font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; color:var(--muted); background:var(--line-soft); font-weight:500}
.prose tr:last-child td{border-bottom:none}
.prose td code{word-break:break-all}

.sysbar.bad{border-color:rgba(255,107,107,.45); background:rgba(255,107,107,.08)}
.sysbar.bad b{color:var(--bad)}

/* ---------- rules ---------- */
.rsec{border-bottom:1px solid var(--line-soft)}
.rsec > summary{list-style:none; cursor:pointer; display:flex; align-items:baseline; gap:10px; padding:13px 2px}
.rsec > summary::-webkit-details-marker{display:none}
.rsec > summary::before{content:"▸"; color:var(--dim); font-size:11px; flex:none; display:inline-block; transition:transform .15s}
.rsec[open] > summary::before{transform:rotate(90deg)}
.rsec > summary b{flex:1; min-width:0; font-size:14px; font-weight:600; word-break:break-word}
.rsec > summary time{font-family:var(--mono); font-size:10.5px; color:var(--dim); flex:none}
.rsec > .prose{padding:0 2px 18px 21px; min-width:0}
.rsec.rsub > summary{padding:9px 2px 9px 22px}
.rsec.rsub > summary b{font-size:13.5px; font-weight:500; color:var(--muted)}
.rsec.rsub[open] > summary b{color:var(--text)}
.rsec.rsub > .prose{padding-left:43px}
.cmds{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.cmd{border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:12px 14px; min-width:0}
.cmd b{font-family:var(--mono); font-size:13px; color:var(--accent-soft)}
.cmd p{margin:4px 0 0; font-size:12.5px; color:var(--muted); word-break:break-word}
details.cmd > summary{list-style:none; cursor:pointer}
.cmd .cdesc{display:block; margin:4px 0 0; font-size:12.5px; color:var(--muted); word-break:break-word}
details.cmd > summary::-webkit-details-marker{display:none}
details.cmd > summary b::after{content:" ▾"; color:var(--dim); font-size:10px}
details.cmd[open]{grid-column:1 / -1}
details.cmd[open] > summary b::after{content:" ▴"}
.cmdbody{border-top:1px solid var(--line-soft); margin-top:10px; padding-top:10px; min-width:0}
.agroup{margin-bottom:14px}
.agroup h4{margin:0 0 4px; font-family:var(--display); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.arow{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; padding:10px 2px; border-bottom:1px solid var(--line-soft); min-width:0}
.arow .dot{align-self:center}
.dot.bad{background:var(--bad); box-shadow:0 0 0 3px rgba(255,107,107,.16)}
.arow .t{flex:1 1 220px; min-width:0}
.arow .t b{display:block; font-size:13.5px; font-weight:500; word-break:break-word}
.arow .t span{display:block; font-size:12px; color:var(--muted); word-break:break-word}
.arow .t .aproblem{color:var(--warn)}
.arow time{font-family:var(--mono); font-size:10.5px; color:var(--dim); white-space:normal}
.mlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px}
.mrow{border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:11px 13px; min-width:0}
.mrow b{display:block; font-size:13px; font-weight:600; word-break:break-word}
.mrow p{margin:4px 0 0; font-size:12px; color:var(--muted); word-break:break-word}
.subs{display:flex; flex-direction:column}
.subrow{display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 14px; padding:11px 2px; border-bottom:1px solid var(--line-soft); min-width:0}
.subrow .t{flex:1 1 220px; min-width:0}
.subrow .t b{font-size:14px; font-weight:600; word-break:break-word}
.subrow .t span:not(.pchip){display:block; font-size:12px; color:var(--muted); word-break:break-word}
.subrow .due{font-family:var(--mono); font-size:12px; color:var(--accent-soft); white-space:nowrap}
.subrow .due em{font-style:normal; color:var(--dim); margin-left:8px}
.subrow .due em.soon{color:var(--warn)}
.spstats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1px; background:var(--line-soft); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.spstats > div{background:var(--surface); padding:16px 20px; min-width:0}
.spstats .k{font-family:var(--mono); font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim)}
.spstats .v{margin-top:5px; font-family:var(--display); font-weight:700; font-size:20px; letter-spacing:.01em; font-variant-numeric:tabular-nums; word-break:break-word}
.spstats .v.small{font-family:var(--sans); font-size:15px; font-weight:600}
.spstats .s{margin-top:2px; font-size:11.5px; color:var(--muted); word-break:break-word}
.spnote{margin:10px 0 0; font-size:12px; color:var(--warn)}
.sptbl{border-collapse:collapse; width:100%; min-width:660px; font-size:12.5px}
.sptbl th{font-family:var(--mono); font-size:10px; letter-spacing:.08em; color:var(--muted); background:var(--line-soft); font-weight:500; text-align:left; padding:8px 10px; white-space:nowrap}
.sptbl td{padding:9px 10px; border-top:1px solid var(--line-soft); vertical-align:top; white-space:nowrap}
.sptbl td.name{white-space:normal; min-width:180px}
.sptbl td b{font-weight:500}
.sptbl td small{display:block; margin-top:1px; font-size:11px; color:var(--dim); word-break:break-word}
.sptbl .num{text-align:right; font-family:var(--mono); white-space:nowrap}
.sptbl .mono{font-family:var(--mono); white-space:nowrap; color:var(--muted)}
.sptbl .dim{color:var(--dim)}
.sptbl .none{color:var(--dim); font-family:var(--sans); font-size:11px}
.sptbl .soon{color:var(--warn)}
.sptbl .act{width:1%; text-align:right; white-space:nowrap; padding-top:6px; padding-bottom:6px}
.sptbl tr.mh td{background:var(--raised); border-top:1px solid var(--line); font-family:var(--mono); font-size:11px; color:var(--muted)}
.sptbl tr.mh td.won{color:var(--text)}
.sptbl tfoot td{border-top:1px solid var(--line); background:var(--raised); font-weight:600}
.sptbl tfoot small{display:inline; margin-left:6px; font-weight:400}
.fxbar{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 12px; margin-top:10px; font-size:12px; color:var(--muted)}
.fxbar b{font-family:var(--mono); font-weight:500; color:var(--text)}
.acnote{display:flex; gap:10px; align-items:flex-start; padding:11px 14px; margin:14px 0 4px; border:1px solid var(--accent-line); background:var(--accent-wash); border-radius:6px; font-size:12.5px; color:var(--muted)}
.acnote b{color:var(--accent-soft); flex:none}
.acgroup{margin-top:22px}
.acgroup h4{margin:0 0 2px; font-family:var(--display); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.acrow .t .h{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px}
.acrow .t .id{font-family:var(--mono); font-size:12px; color:var(--accent-soft); word-break:break-all}
.acrow .t .memo{color:var(--dim)}
.acmeta{display:flex; flex-wrap:wrap; align-items:center; gap:6px; flex:none}
.acchip{font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:3px; border:1px solid var(--line); color:var(--muted); white-space:nowrap}
.acchip.ok{color:var(--ok); border-color:rgba(70,217,160,.45)}
.acchip.warn{color:var(--warn); border-color:rgba(240,184,69,.45)}
.acchip.off{color:var(--dim)}

/* ---------- launch ---------- */
.lcards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px}
.lcard{border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0}
.lcard.live{border-color:rgba(70,217,160,.55); background:linear-gradient(160deg,rgba(70,217,160,.11),var(--surface) 62%)}
.lcard .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.lcard h3{margin:0; font-size:15px; font-weight:600}
.lcard .ver{font-family:var(--mono); font-size:11px; color:var(--accent-soft); white-space:nowrap}
.sbadge{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10.5px; padding:3px 8px; border-radius:3px; border:1px solid var(--line); color:var(--muted); text-decoration:none; width:fit-content}
.sbadge.pub{color:var(--ok); border-color:rgba(70,217,160,.5); background:rgba(70,217,160,.08)}
.lrel{font-size:12.5px; color:var(--muted); min-width:0}
.lrel a{font-family:var(--mono)}
.lrel p{margin:3px 0 0; font-size:12px; word-break:break-word}
.lnum{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px; font-family:var(--mono); font-size:10.5px; color:var(--dim); border-top:1px solid var(--line-soft); padding-top:9px}
.lnum b{font-family:var(--display); font-size:16px; color:var(--text); margin-right:4px}
.lnum a{margin-left:auto}
.livebar{display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:12px 16px; margin-bottom:12px; border:1px solid rgba(70,217,160,.5); background:rgba(70,217,160,.08); border-radius:6px; font-size:13px}
.livebar b{color:var(--ok)}
.livebar a{margin-left:auto; font-family:var(--mono); font-size:11px}

/* ---------- decision flows ---------- */
.dmore{font-family:var(--mono); font-size:10px; color:var(--accent-soft); border:1px solid var(--accent-line); border-radius:9px; padding:0 7px; line-height:17px}
.dprev{padding:2px 0 2px 12px; border-left:2px solid var(--line); display:flex; flex-direction:column; gap:7px}
.dprev div{font-size:12.5px; color:var(--muted); word-break:break-word}
.dprev time{font-family:var(--mono); font-size:10px; color:var(--dim); margin-right:6px}

/* ---------- content board ---------- */
.kanban{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; align-items:start}
.kcol{border:1px solid var(--line); border-radius:6px; background:var(--surface); min-width:0}
.kcol header{display:flex; justify-content:space-between; align-items:baseline; padding:11px 13px; border-bottom:1px solid var(--line-soft)}
.kcol header b{font-family:var(--display); font-size:12px; letter-spacing:.12em}
.kcol header span{font-family:var(--mono); font-size:11px; color:var(--dim)}
.kcards{display:flex; flex-direction:column; gap:8px; padding:10px}
.ccard{border:1px solid var(--line-soft); border-radius:5px; background:var(--raised); padding:10px 11px; display:flex; flex-direction:column; gap:6px; min-width:0}
.ccard .h{display:flex; flex-wrap:wrap; align-items:center; gap:6px}
.ccard b{font-size:13px; font-weight:600; word-break:break-word}
.ccard p{margin:0; font-size:12px; color:var(--muted); word-break:break-word}
.ccard .f{display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-family:var(--mono); font-size:10px; color:var(--dim)}
.guess{font-family:var(--mono); font-size:9.5px; color:var(--warn); border:1px dashed rgba(240,184,69,.55); border-radius:3px; padding:0 5px}
.outs{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px}
.out{border:1px solid var(--line); border-radius:6px; background:var(--surface); padding:12px 14px; min-width:0}
.out h4{margin:0 0 8px; font-size:13px; font-weight:600; word-break:break-word}
.frow{display:flex; gap:10px; align-items:baseline; padding:6px 0; border-top:1px solid var(--line-soft); font-size:12px; min-width:0}
.frow span{flex:1; min-width:0; word-break:break-all}
.frow time,.frow i{font-family:var(--mono); font-size:10px; color:var(--dim); font-style:normal; flex:none}

/* ---------- sessions board ---------- */
.sproj{border:1px solid var(--line); border-radius:6px; background:var(--surface); min-width:0}
.sproj + .sproj{margin-top:14px}
.sproj > header{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px; padding:12px 14px; border-bottom:1px solid var(--line-soft)}
.sproj > header b{font-size:15px; font-weight:600}
.sproj > header span{font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.sproj > header .run{color:var(--ok)}
.ssub{padding:10px 14px 4px}

    if (!m) return null;
    var mm = +m[2] - 1 + (cycle === "yearly" ? 12 : 1) * k, yy = +m[1] + Math.floor(mm / 12);

    if (c === "quota_exceeded") return "저장 공간이 가득 찼습니다. 오래된 문서를 정리해 주세요.";
    if (c === "resource_exhausted") return "요청이 많습니다. 잠시 후 다시 시도해 주세요.";
    if (c === "revoked" || c === "not_granted") return "저장 권한이 없습니다. 화면 내용만 변경되었습니다.";
    if (c === "invalid_argument") return "저장할 수 없는 값입니다. 내용을 확인해 주세요.";
    return "저장하지 못했습니다. 다시 시도해 주세요.";
  }

  /* ============ modal ============ */
  function closeModal() { $("#modalRoot").innerHTML = ""; }

  function openEditor(opts) {
    var fields = opts.fields || [];
    var html = '<div class="scrim" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '"><div class="sheet"><header><h3>' +
      esc(opts.title) + '</h3><button class="mini" data-x="cancel">닫기</button></header><div class="body">';
    fields.forEach(function (f, i) {
      var id = "f" + i;
      html += '<div class="field"><label for="' + id + '">' + esc(f.label) + "</label>";
      if (f.type === "textarea") {
        html += '<textarea id="' + id + '" data-k="' + esc(f.key) + '" placeholder="' + esc(f.placeholder || "") + '">' + esc(f.value || "") + "</textarea>";
      } else if (f.type === "select") {
        html += '<select id="' + id + '" data-k="' + esc(f.key) + '">' + (f.options || []).map(function (o) {
          return '<option value="' + esc(o) + '"' + (String(f.value) === String(o) ? " selected" : "") + ">" + esc(o) + "</option>";
        }).join("") + "</select>";
      } else {
        html += '<input id="' + id + '" data-k="' + esc(f.key) + '" type="' + (f.type || "text") + '" value="' + esc(f.value == null ? "" : f.value) +
          '" placeholder="' + esc(f.placeholder || "") + '"' + (f.type === "number" ? (f.key === "progress" ? ' min="0" max="100" step="1"' : ' min="0" step="any"') : "") + ">";
      }
      if (f.hint) html += '<p class="hint">' + esc(f.hint) + "</p>";
      html += "</div>";
    });
    html += "</div><footer>";
    if (opts.translatePair) {
      html += '<button class="btn" data-x="translate" data-from="' + esc(opts.translatePair[0]) + '" data-to="' + esc(opts.translatePair[1]) + '">번역</button>';
    }
    html += (opts.onDelete ? '<button class="btn danger" data-x="delete">삭제</button>' : "") +
      '<button class="btn" data-x="cancel">취소</button><button class="btn primary" data-x="save">' + esc(opts.saveLabel || "저장") + "</button></footer></div></div>";

    var root = $("#modalRoot");
    root.innerHTML = html;
    var sheet = $(".sheet", root);
    var first = sheet.querySelector("input,textarea,select");
    if (first) first.focus();

    $(".scrim", root).addEventListener("click", function (ev) {
      if (ev.target.classList && ev.target.classList.contains("scrim")) closeModal();
      var x = ev.target.getAttribute && ev.target.getAttribute("data-x");
      if (!x) return;
      if (x === "cancel") return closeModal();
      if (x === "delete") { closeModal(); opts.onDelete(); return; }
      if (x === "translate") {
        var fromKey = ev.target.getAttribute("data-from"), toKey = ev.target.getAttribute("data-to");
        var fromEl = sheet.querySelector('[data-k="' + fromKey + '"]'), toEl = sheet.querySelector('[data-k="' + toKey + '"]');
        var defEl = sheet.querySelector('[data-k="definition"]');
        if (!fromEl || !toEl) return;
        var fromText = fromEl.value.trim();
        if (!fromText) return toast("번역할 내용을 입력해주세요.");
        var definition = defEl ? defEl.value.trim() : "";
        var defInfo = definition ? "\n\n정의: " + definition : "";
        var prompt = fromKey.includes("en") ?
          "'" + fromText + "'을(를) 다음을 고려해서 자연스러운 한글로 번역해줘:" + defInfo + "\n\n단어나 짧은 구만 답해줘." :
          "'" + fromText + "'을(를) 다음을 고려해서 자연스러운 영어로 번역해줘:" + defInfo + "\n\n단어나 짧은 구만 답해줘.";
        ev.target.disabled = true; ev.target.textContent = "번역 중...";
        (async function () {
          try {
            var sample = await claude.use("sample");
            if (!sample) { toast("웹판에서는 번역 기능을 쓸 수 없습니다."); ev.target.disabled = false; ev.target.textContent = "번역"; return; }
            var result = await sample(prompt);
            toEl.value = result.text.trim();
            toast("번역 완료");
            ev.target.disabled = false; ev.target.textContent = "번역";
          } catch (err) {
            toast("번역 실패: " + (err && err.message ? err.message : "다시 시도해주세요"));
            ev.target.disabled = false; ev.target.textContent = "번역";
          }
        })();
        return;
      }
      if (x === "save") {
        var values = {};
        Array.prototype.forEach.call(sheet.querySelectorAll("[data-k]"), function (el) {
          values[el.getAttribute("data-k")] = el.value;
        });
        closeModal();
        try {
          opts.onSave(values);
        } catch (err) {
          toast("저장 중 오류가 발생했습니다: " + (err && err.message ? err.message : "알 수 없는 오류"));
        }
      }
    });
  }

  /* ============ status rendering ============ */
  function stateDot(status) {
    var s = String(status || "").toLowerCase();
    if (s === "working" || s === "operating") return "ok live";
    if (s === "waiting") return "warn";
    if (s === "available") return "idle";
    return "";
  }
  function stateHTML(status) {
    return '<span class="state"><span class="dot ' + stateDot(status) + '"></span>' + esc(status || "—") + "</span>";
  }
  function barHTML(pct) {
    var n = Math.max(0, Math.min(100, Number(pct) || 0));
    var on = Math.round(n / 10), seg = "";
    for (var i = 0; i < 10; i++) seg += '<i class="' + (i < on ? "on" : "") + '"></i>';
    return '<span class="bar">' + seg + "<b>" + n + "%</b></span>";
  }

  /* ============ feed (read-only; written by WMW/공통/HQ/collect.js) ============ */
  function fItems(key) { return (F[key] && Array.isArray(F[key].items)) ? F[key].items : []; }
  function pName(key) {
    var list = (F.meta && F.meta.projects) || [];
    for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i].name;
    return key || "—";
  }
  function pKeys() {
    var list = (F.meta && F.meta.projects) || [];
    if (list.length) return list.map(function (p) { return p.key; });
    return fItems("projects").map(function (p) { return p.key; });
  }
  function kst(iso, withTime) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return String(iso);
    var o = { timeZone: "Asia/Seoul", month: "2-digit", day: "2-digit", hour12: false };
    if (withTime) { o.hour = "2-digit"; o.minute = "2-digit"; }
    return d.toLocaleString("ko-KR", o).replace(/\.\s?/g, ".").replace(/\.$/, "").replace(/\.(\d{2}:)/, " $1");
  }
  function ago(iso) {
    var t = new Date(iso).getTime();
    if (!t) return "";
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 0) {
      m = -m;
      if (m < 60) return m + "분 뒤";
      if (m < 60 * 48) return Math.round(m / 60) + "시간 뒤";
      return Math.round(m / 1440) + "일 뒤";
    }
    if (m < 1) return "방금";
    if (m < 60) return m + "분 전";
    if (m < 60 * 48) return Math.round(m / 60) + "시간 전";
    return Math.round(m / 1440) + "일 전";
  }
  function isOpen(d) { var s = DEC[d.id]; return !s || s.state === "later"; }
  function threadKey(d) { return d.thread || "id:" + d.id; }
  function openFlows(proj) {
    // Until the decision records are in (or if they failed), don't count: everything would look open.
    if (db && !(DEC_LOAD && DEC_LOAD.ok)) return [];
    var byT = {};
    fItems("decisions").forEach(function (d) { (byT[threadKey(d)] = byT[threadKey(d)] || []).push(d); });
    var flows = [];
    Object.keys(byT).forEach(function (k) {
      var list = byT[k].slice().sort(function (a, b) { return String(b.at || "").localeCompare(String(a.at || "")); });
      var open = list.filter(isOpen);
      if (!open.length) return;
      if (proj && proj !== "all" && open[0].project !== proj) return;
      flows.push({ key: k, head: open[0], all: list, open: open });
    });
    return flows.sort(function (a, b) { return String(b.head.at || "").localeCompare(String(a.head.at || "")); });
  }
  function openDecisions(proj) { return openFlows(proj).map(function (f) { return f.head; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }
  function openCountBy() {
    var c = {};
    openDecisions().forEach(function (d) { c[d.project] = (c[d.project] || 0) + 1; });
    return c;
  }
  function asOfHTML() {
    var at = F.meta && F.meta.generatedAt;
    if (!at) return '<span class="asof stale">자료 없음</span>';
    var stale = Date.now() - new Date(at).getTime() > 3 * 3600 * 1000;
    return '<span class="asof' + (stale ? " stale" : "") + '" title="' + esc(at) + '">자료 기준 ' + esc(kst(at, true)) + " · " + esc(ago(at)) + "</span>";
  }
  function sysBarsHTML() {
    var checks = ((F.system && F.system.checks) || []).slice();
    if (DEC_LOAD && !DEC_LOAD.ok) checks.push({ key: "decisions-load", name: "결정 기록을 읽지 못함", level: "bad", detail: "닫은 결정까지 열린 것으로 보일 수 있습니다 — 새로고침해 보세요 (" + DEC_LOAD.code + ")" });
    var pend = pendingDeliveries().length;
    if (pend) checks.push({ key: "decision-delivery", name: "결정 전달 대기 " + pend + "건", level: "warn", detail: "정함을 눌렀지만 원래 세션에 아직 닿지 않았습니다 — Decisions 탭의 «다시 보내기»" });
    function lv(c) { return c.level || (c.ok === false ? "warn" : "ok"); }
    return checks.filter(function (c) { return lv(c) !== "ok"; }).sort(function (a, b) {
      return (lv(a) === "bad" ? 0 : 1) - (lv(b) === "bad" ? 0 : 1);
    }).map(function (c) {
      var bad = lv(c) === "bad";
      return '<div class="sysbar' + (bad ? " bad" : "") + '" role="alert"><b>' + (bad ? "✕ " : "⚠ ") + esc(c.name || c.key) + "</b><span>" + esc(c.detail || "") +
        (c.at ? ' <span style="font-family:var(--mono);font-size:10.5px">· ' + esc(kst(c.at, true)) + "</span>" : "") + "</span></div>";
    }).join("");
  }
  function projChips(act, current, counts) {
    var cur = current || "all";
    return '<div class="chips">' + ["all"].concat(pKeys()).map(function (k) {
      var n = counts ? (k === "all" ? Object.keys(counts).reduce(function (s, x) { return s + counts[x]; }, 0) : counts[k] || 0) : 0;
      return '<button data-act="' + act + '" data-id="' + esc(k) + '" aria-pressed="' + (cur === k) + '">' +
        esc(k === "all" ? "전체" : pName(k)) + (n ? "<em>" + n + "</em>" : "") + "</button>";
    }).join("") + "</div>";
  }

  function feedProjectCards() {
    var items = fItems("projects"), open = openCountBy();
    if (!items.length) return null;
    return '<div class="fcards">' + items.map(function (p) {
      var chip = p.hasHistory === false ? '<span class="warnchip">⚠ 커밋 이력 없음</span>' :
        (p.hasHistory == null || p.repo === false) ? '<span class="nochip">저장소 없음</span>' : "";
      var lc = p.lastCommit;
      var oc = open[p.key] || 0;
      return '<button class="fcard" data-act="flow-proj" data-id="' + esc(p.key) + '">' +
        '<div class="top"><h3>' + esc(p.name || pName(p.key)) + "</h3>" +
        (p.version ? '<span class="ver">v' + esc(String(p.version).replace(/^v/, "")) + "</span>" : "") + "</div>" + chip +
        '<div class="metrics">' +
          '<div><div class="k">7일 커밋</div><div class="v">' + (p.commits7d || 0) + "</div></div>" +
          '<div><div class="k">7일 보고</div><div class="v">' + (p.reports7d || 0) + "</div></div>" +
          '<div><div class="k">미커밋</div><div class="v' + (p.uncommitted ? " hot" : "") + '">' + (p.uncommitted || 0) + "</div></div>" +
          '<div><div class="k">열린 결정</div><div class="v' + (oc ? " hot" : "") + '">' + oc + "</div></div>" +
        "</div>" +
        (lc ? '<div class="lastc"><p><code>' + esc(lc.sha || "") + "</code>" + esc(lc.subject || "") + "</p><time>" +
          esc(kst(lc.at, true)) + " · " + esc(ago(lc.at)) + "</time></div>" :
          '<div class="lastc"><p style="color:var(--dim)">마지막 커밋 없음</p></div>') +
        "</button>";
    }).join("") + "</div>";
  }

  var DSTATE = { decided: "정함", later: "보류", dropped: "버림" };
  function renderDecide() {
    var all = fItems("decisions");
    if (!all.length) return '<p class="empty">결정할 항목이 없습니다. 수집기가 feed/decisions 를 채우면 여기에 나타납니다.</p>';
    var proj = uiState.dProj || "all", showClosed = !!uiState.dClosed;
    var flows = showClosed ? null : openFlows(proj);
    var flowOf = {};
    if (flows) flows.forEach(function (f) { flowOf[f.head.id] = f; });
    var list = showClosed ? all.filter(function (d) { return (proj === "all" || d.project === proj) && !isOpen(d); }) : flows.map(function (f) { return f.head; });
    var h = '<div class="sec-head" style="flex-wrap:wrap"><span class="eyebrow">' + (showClosed ? "닫힌 결정" : "열린 결정 · 흐름") + " · " + list.length + "</span>" +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + asOfHTML() +
      '<button class="mini" data-act="d-closed">' + (showClosed ? "열린 것 보기" : "닫힌 것 보기") + "</button></div></div>" +
      '<div style="margin-bottom:14px">' + projChips("d-proj", proj, openCountBy()) + "</div>" +
      (showClosed ? "" : '<p class="asof" style="margin:-4px 0 12px;white-space:normal">' + esc(sendStatusText()) + "</p>");
    if (DEC_LOAD && !DEC_LOAD.ok) h += '<div class="sysbar bad" role="alert"><b>✕ 결정 기록을 읽지 못했습니다</b><span>닫은 결정까지 열린 것으로 보일 수 있으니 지금 숫자를 믿지 마세요. 새로고침해 보세요 (' + esc(DEC_LOAD.code) + ")</span></div>";
    else if (!DEC_LOAD && db) h += '<p class="asof" style="margin:-4px 0 12px">결정 기록을 읽는 중…</p>';
    var pend = pendingDeliveries().length;
    if (pend) h += '<div class="sysbar" role="status"><b>⚠ 결정 전달 대기 ' + pend + "건</b><span>정함을 눌렀지만 아직 원래 세션에 닿지 않았습니다. " +
      '<button class="mini" data-act="d-resend">다시 보내기</button></span></div>';
    if (!list.length) return h + '<p class="empty">' + (showClosed ? "닫힌 결정이 없습니다." : "열린 결정이 없습니다. 모두 정했습니다.") + "</p>";
    h += '<div class="dlist">' + list.map(function (d) {
      var s = DEC[d.id];
      var meta = '<div class="meta"><span class="kd ' + esc(d.kind) + '"></span><span class="pchip">' + esc(pName(d.project)) + "</span>" +
        "<time>" + esc(kst(d.at, true)) + "</time>" + (d.label ? "<span>" + esc(d.label) + "</span>" : "") +
        (s ? '<span class="dstate ' + esc(s.state) + '">' + esc(DSTATE[s.state] || s.state) + "</span>" : "");
      var fl = flowOf[d.id], others = fl ? fl.all.length - 1 : 0;
      var exp = fl && uiState.dExp && uiState.dExp[fl.key];
      if (others) meta += '<button class="dmore" data-act="d-expand" data-id="' + esc(fl.key) + '" aria-expanded="' + !!exp + '">외 ' + others + "판" + (exp ? " ▴" : " ▾") + "</button>";
      meta += "</div>";
      var body = '<p class="task">' + esc(d.task || "") + "</p>" + (d.followUp ? '<p class="fu">' + esc(d.followUp) + "</p>" : "");
      if (exp) {
        body += '<div class="dprev">' + fl.all.filter(function (x) { return x.id !== d.id; }).map(function (x) {
          var xs = DEC[x.id];
          return "<div><time>" + esc(kst(x.at, true)) + "</time>" +
            (xs ? '<span class="dstate ' + esc(xs.state) + '">' + esc(DSTATE[xs.state] || xs.state) + "</span> " : '<span class="dstate later">열림</span> ') +
            esc(x.task || "") + (x.followUp ? ' <span style="color:var(--dim)">→ ' + esc(x.followUp) + "</span>" : "") + "</div>";
        }).join("") + "</div>";
      }
      var act;
      if (showClosed) {
        act = '<div class="dact">' + (s && s.note ? '<span class="done-note" style="flex:1;min-width:0">' + esc(s.note) + "</span>" : '<span style="flex:1"></span>') +
          deliveryHTML(s) +
          '<time class="asof">' + esc(kst(s && s.decidedAt, true)) + "</time>" +
          '<button class="dbtn" data-act="d-reopen" data-id="' + esc(d.id) + '">다시 열기</button></div>';
      } else {
        var nv = noteDraft[d.id] != null ? noteDraft[d.id] : (s && s.note) || "";
        act = '<div class="dact"><input data-dnote="' + esc(d.id) + '" value="' + esc(nv) + '" placeholder="한 줄 메모 — 무엇으로 정했는지" aria-label="결정 메모">' +
          '<button class="dbtn ok" data-act="d-set" data-state="decided" data-id="' + esc(d.id) + '">정함</button>' +
          '<button class="dbtn later" data-act="d-set" data-state="later" data-id="' + esc(d.id) + '">보류</button>' +
          '<button class="dbtn drop" data-act="d-set" data-state="dropped" data-id="' + esc(d.id) + '">버림</button></div>';
      }
      return '<div class="ditem">' + meta + body + act + "</div>";
    }).join("") + "</div>";
    return h;
  }

  function sendStatusText() {
    if (canSend === "available") return "정함을 누르면 그 결정을 올린 Claude 세션으로 전달되어 이어서 진행합니다. 보류·버림은 기록만 합니다.";
    if (canSend === "writers_only") return "편집 권한이 있어야 Claude 로 전달됩니다. 정함은 기록만 됩니다.";
    return "정함은 기록됩니다. 전달은 Claude 앱이 켜져 있을 때 «다시 보내기» 로 합니다.";
  }
  /* Decision delivery (WMW/공통/HQ/README.md «결정 전달»): [정함] marks deliver:true; the relay session
     that receives the comment forwards it to the reporting session and writes deliveredTo/deliveredAt. */
  function pendingDeliveries() {
    return Object.keys(DEC).filter(function (id) {
      var s = DEC[id];
      return s && s.state === "decided" && s.deliver && !s.deliveredAt && !s.deliverError;
    });
  }
  function deliveryHTML(s) {
    if (!s || !s.deliver) return "";
    if (s.deliveredAt) return '<span class="asof" style="color:var(--ok)">전달됨 → ' + esc(s.deliveredTitle || s.deliveredTo || "세션") + " · " + esc(kst(s.deliveredAt, true)) + "</span>";
    if (s.deliverError) return '<span class="asof" style="color:var(--bad)">전달 실패: ' + esc(s.deliverError) + "</span>";

    }).then(function () { toast("밀린 결정 " + n + "건을 다시 보냈습니다."); }, function (e) {

    }, function () { if (canSend !== "off") { canSend = "off"; if (route.view === "decide") renderKeepingFocus(); } });

  function decisionText(d, note) {

  function setDecision(id, state, rowEl) {

    var at = new Date().toISOString();
    olders.forEach(function (x) {

      DEC[x.id] = od;

    });
    var anchorP = (state === "decided" && item && comments && canSend === "available" && rowEl) ? comments.anchorFor(rowEl) : null;
    var prev = DEC[id];

  /* ---------- rules (feed/rules · feed/rules_projects) ---------- */
  // A section's "### x.y" subsections get their own foldable rows under it, so e.g. 2.1 can be found without opening 2.
  function ruleSec(key, s, lc) {
    var at = (s.lastChange && s.lastChange.at) || (lc && lc.at) || null;
    var parts = String(s.body || "").split(/^### +(.+)$/m), subs = [];
    for (var i = 1; i < parts.length; i += 2) subs.push({ title: parts[i].trim(), body: parts[i + 1] || "" });
    var intro = parts[0].trim() ? parts[0] : "";
    return ruleRow(key, s.title || "", intro, at, false, subs.length) +
      subs.map(function (x, j) { return ruleRow(key + ":" + j, x.title, x.body, null, true, 0); }).join("");
  }
  function ruleRow(key, title, body, at, sub, nSubs) {
    var open = !!(uiState.ruleOpen || {})[key];
    return '<details class="rsec' + (sub ? " rsub" : "") + '" data-rkey="' + esc(key) + '"' + (open ? " open" : "") + "><summary><b>" + esc(title) + "</b>" +
      (at ? '<time title="마지막 변경">' + esc(kst(at)) + "</time>" : "") + "</summary>" +
      prose(body, nSubs ? "아래 하위 절에 내용이 있습니다." : "내용 없음") + "</details>";
  }

      var out = byKey("task:" + a.name);
      if (/준비/.test(a.name)) out = out.concat(byKey("daily-prepare"), byKey("daily-summary"));
      else if (/Daily Report/i.test(a.name)) out = out.concat(byKey("daily-send"));

    if (a.kind === "Claude 예약 작업" && a.name === "wmw-hq-sync") return byKey("hq-sync");

          return '<div class="frow"><span title="' + esc(f.file || "") + '">' + esc(name) + "</span><time>" + esc(kst(f.at)) + "</time><i>" + (f.mb != null ? esc(f.mb) + "MB" : "") + "</i></div>";
        }).join("") + (files.length > 8 ? '<p class="asof" style="margin:6px 0 0">외 ' + (files.length - 8) + "개</p>" : "") + "</div>";
    }).join("") + "</div>" : '<p class="empty">결과 폴더 자료가 없습니다.</p>';
    return h + "</section>";
  }

  /* ---------- sessions board (feed/sessions + session_groups/<key>) ---------- */
  var SUBS = ["기획", "개발", "마케팅", "미분류"];
  var SUB_GUESS = [
    ["마케팅", /마케팅|릴스|인스타|광고|홍보|스토리|티저|콘텐츠|캐러셀|SNS|숏폼|영상/i],
    ["기획", /기획|로고|디자인|아이콘|브랜드|시안|전략|계획|조사|검토|DB|데이터|비서/i],
    ["개발", /개발|빌드|버그|구현|코드|앱|게임|MVP|SDK|테스트|출시|릴리스|v\d|파이프|자동화|홈페이지/i]
  ];
  // Feed ids were once cut to 8 hex chars; key by that stable prefix so an owner's choice survives the switch to full ids.
  function sessKey(id) { var m = /^(local_[A-Za-z0-9]{8})/.exec(id || ""); return m ? m[1] : String(id || ""); }
  // The page's frame cannot open claude:// links itself, so the button goes through the
  // owner's PC relay (WMW/공통/HQ/open-helper.js on 127.0.0.1), which opens the session.
  var FULL_ID = /^local_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  function sessLink(x) {
    var id = x.id || "";
    if (!FULL_ID.test(id) && x.link) {
      var m = /^claude:\/\/claude\.ai\/epitaxy\/(local_[0-9a-f-]{36})$/.exec(x.link);
      if (m) id = m[1];
    }
    return FULL_ID.test(id) ? "http://127.0.0.1:47321/open?id=" + id : null;
  }
  function openLinkHTML(x) {
    var l = sessLink(x);
    return l ? '<a class="openbtn" href="' + esc(l) + '" target="_blank" rel="noopener" title="Claude 앱에서 이 세션 열기 — 이 PC 의 중계 프로그램이 켜져 있어야 합니다">앱에서 열기 ↗</a>'
      : '<span class="openbtn off" title="세션 ID 가 잘려 있어 열 수 없습니다 — 다음 자료 갱신 뒤 열립니다">열기 대기</span>';
  }
  /* Each project's groups live in session_subs/<doc> as a tree: tree:[{id,name,parent}] in display order.
     A group can hold sessions and child groups (up to MAX_DEPTH levels). "미분류" is always the last top-level
     group, the catch-all, and holds no child groups. Older docs only had subs:[names] — those become top-level
     groups whose id is the name, so sessions already filed under a name (session_groups/<key>.sub) stay put. */
  var LEFTOVER = "미분류";
  var MAX_DEPTH = 3;
  function subsDocId(k) {
    if (/^[A-Za-z0-9_-]{1,100}$/.test(k)) return k;
    var h = 5381;
    for (var i = 0; i < k.length; i++) h = ((h * 33) ^ k.charCodeAt(i)) >>> 0;
    return "g_" + h.toString(36);
  }
  function findNode(tree, id) {
    for (var i = 0; i < tree.length; i++) if (tree[i].id === id) return tree[i];
    return null;
  }
  // The saved tree (or the defaults), cleaned: no dangling parents, no cycles, 미분류 last.
  function treeOf(k) {
    var d = SUBS_DOC[k], nodes;
    if (d && Array.isArray(d.tree)) {
      nodes = d.tree.filter(function (n) { return n && n.id && n.id !== LEFTOVER; })
        .map(function (n) { return { id: String(n.id), name: String(n.name || n.id), parent: n.parent ? String(n.parent) : null }; });
    } else {
      var names = d && Array.isArray(d.subs) ? d.subs : SUBS;
      nodes = names.filter(function (n) { return n && n !== LEFTOVER; }).map(function (n) { return { id: n, name: n, parent: null }; });
    }
    nodes.forEach(function (n) { if (n.parent && (!findNode(nodes, n.parent) || n.parent === LEFTOVER)) n.parent = null; });
    nodes.forEach(function (n) {
      var seen = {}, p = n.parent;
      while (p) {
        if (seen[p] || p === n.id) { n.parent = null; break; }
        seen[p] = true;
        var pn = findNode(nodes, p);
        p = pn ? pn.parent : null;
      }
    });
    nodes.push({ id: LEFTOVER, name: LEFTOVER, parent: null });
    return nodes;
  }
  function sessSub(x, tree) {
    var g = SG[sessKey(x.id)];
    if (g && g.sub) return { sub: g.sub, guess: false };
    var t = (x.title || "") + " " + (x.group || "");
    for (var i = 0; i < SUB_GUESS.length; i++) {
      if (SUB_GUESS[i][1].test(t)) return { sub: tree && !findNode(tree, SUB_GUESS[i][0]) ? LEFTOVER : SUB_GUESS[i][0], guess: true };
    }
    return { sub: LEFTOVER, guess: true };
  }
  function sessProject(x) { return x.project || ("g:" + (x.group || "")); }
  function sessProjectName(k) { return k.indexOf("g:") === 0 ? (k.slice(2) || "프로젝트 없음") : pName(k); }
  function projSessions(k) { return fItems("sessions").filter(function (x) { return sessProject(x) === k; }); }
  // Groups actually shown: the saved tree plus any group a session still points at (then as a top-level group).
  function treeShown(k) {
    var tree = treeOf(k);
    projSessions(k).forEach(function (x) {
      var s2 = sessSub(x, tree).sub;
      if (!findNode(tree, s2)) tree.splice(tree.length - 1, 0, { id: s2, name: s2, parent: null });
    });
    return tree;
  }
  function kidsOf(tree, pid) { return tree.filter(function (n) { return (n.parent || null) === (pid || null); }); }
  function depthOf(tree, id) { var d = 1, n = findNode(tree, id); while (n && n.parent) { d++; n = findNode(tree, n.parent); } return d; }
  function subtreeIds(tree, id) {
    var out = [id];
    kidsOf(tree, id).forEach(function (c) { out = out.concat(subtreeIds(tree, c.id)); });
    return out;
  }
  function heightOf(tree, id) {
    var ks = kidsOf(tree, id);
    return 1 + (ks.length ? Math.max.apply(null, ks.map(function (c) { return heightOf(tree, c.id); })) : 0);
  }
  function groupPath(tree, id) {
    var names = [], n = findNode(tree, id);
    while (n) { names.unshift(n.name); n = n.parent ? findNode(tree, n.parent) : null; }
    return names.join(" › ");
  }

  function renderSessions() {
    var items = fItems("sessions").slice();
    var at = F.sessions && F.sessions.at;
    var proj = uiState.sProj || "all", runOnly = !!uiState.sRun;
    var h = '<div class="sec-head" style="flex-wrap:wrap"><span class="eyebrow">Claude 세션 · ' + items.length + "</span>" +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' + (at ? '<span class="asof">' + esc(kst(at, true)) + " 기준 · " + esc(ago(at)) + "</span>" : asOfHTML()) +
      '<button class="mini" data-act="s-run" aria-pressed="' + runOnly + '">' + (runOnly ? "전체 보기" : "실행 중만") + "</button></div></div>";
    if (!items.length) return h + '<p class="empty">세션 자료가 없습니다. 자료 갱신 때 feed/sessions 가 채워지면 여기에 나타납니다.</p>';

    var byP = {};
    items.forEach(function (x) { (byP[sessProject(x)] = byP[sessProject(x)] || []).push(x); });
    var keys = Object.keys(byP).sort(function (a, b) {
      var la = byP[a].reduce(function (m, x) { return x.lastActivityAt > m ? x.lastActivityAt : m; }, "");
      var lb = byP[b].reduce(function (m, x) { return x.lastActivityAt > m ? x.lastActivityAt : m; }, "");

    });
    h += '<div class="chips" style="margin-bottom:8px">' + ["all"].concat(keys).map(function (k) {
      var n = k === "all" ? items.length : byP[k].length;
      return '<button data-act="s-proj" data-id="' + esc(k) + '" aria-pressed="' + (proj === k) + '">' + esc(k === "all" ? "전체" : sessProjectName(k)) + " " + n + "</button>";
    }).join("") + "</div>";
    h += '<p class="asof" style="margin:0 0 14px;white-space:normal">세션 왼쪽 ⋮⋮ 를 끌어 그룹(하위 그룹 포함)에 놓으면 옮겨집니다(키보드는 ⋮⋮ 에서 ↑↓). 그룹도 ⋮⋮(마우스는 그룹 제목 어디든)를 끌어 옮깁니다 — 다른 그룹 제목 가운데나 안쪽에 놓으면 그 하위로 들어가고, 제목 윗부분에 놓으면 그 앞으로, 프로젝트 제목이나 아래 «맨 위 단계로 빼기»에 놓으면 하위에서 빠집니다(키보드는 ⋮⋮ 에서 → 안으로 · ← 밖으로). 그룹 만들기·이름·삭제는 프로젝트 오른쪽 [그룹 편집]에서 합니다. 하위 그룹은 ' + MAX_DEPTH + '단계까지. 처음 자리는 제목으로 짐작한 것입니다. 이 화면의 분류는 홈페이지에만 적용되고 Claude 앱 사이드바는 바뀌지 않습니다. [앱에서 열기]는 이 PC 의 중계 프로그램(로그인 때 자동 시작)을 거쳐 열려서, 다른 기기에서는 열리지 않습니다.</p>';

    var shown = 0;
    keys.filter(function (k) { return proj === "all" || proj === k; }).forEach(function (k) {
      var editing = uiState.sEdit === k;
      var list = byP[k].filter(function (x) { return !runOnly || x.running; })
        .sort(function (a, b) { return String(b.lastActivityAt || "").localeCompare(String(a.lastActivityAt || "")); });
      if (!list.length && !editing) return;
      shown += list.length;
      var tree = treeShown(k);
      var subOf = {};
      byP[k].forEach(function (x) { subOf[sessKey(x.id)] = sessSub(x, tree).sub; });
      function countIn(ids, rows) { return rows.filter(function (x) { return ids.indexOf(subOf[sessKey(x.id)]) >= 0; }).length; }
      var running = byP[k].filter(function (x) { return x.running; }).length;
      h += '<section class="sproj' + (editing ? " editing" : "") + '" data-sproj="' + esc(k) + '"><header><b>' + esc(sessProjectName(k)) + "</b><span>세션 " + byP[k].length + "</span>" +
        (running ? '<span class="run">● 실행 중 ' + running + "</span>" : "") +
        '<span class="hgap"></span>' +
        (editing ? '<button class="mini" data-act="sg-add" data-id="' + esc(k) + '" data-parent="">+ 그룹</button>' : "") +
        '<button class="mini" data-act="sg-edit" data-id="' + esc(k) + '" aria-pressed="' + editing + '">' + (editing ? "완료" : "그룹 편집") + "</button></header>";
      if (editing && uiState.sAdd && uiState.sAdd.k === k && !uiState.sAdd.parent) h += addRow(k, "");

      function addRow(kk, parent) {
        return '<div class="newsub gadd"><input id="sg-add" class="ginput" data-sgadd="' + esc(kk) + '" data-parent="' + esc(parent) + '" placeholder="' +
          (parent ? "«" + esc(groupPath(tree, parent)) + "» 안에 만들 하위 그룹 이름" : "새 그룹 이름 (예: 디자인)") + '" maxlength="20" aria-label="새 그룹 이름">' +
          '<button class="mini" data-act="sg-add-ok" data-id="' + esc(kk) + '">추가</button><button class="mini" data-act="sg-add-cancel">취소</button></div>';
      }
      function parentOptions(node) {
        var banned = subtreeIds(tree, node.id), myH = heightOf(tree, node.id);
        var opts = ['<option value=""' + (!node.parent ? " selected" : "") + ">맨 위</option>"];
        tree.forEach(function (n) {

          if (depthOf(tree, n.id) + myH > MAX_DEPTH) return;
          opts.push('<option value="' + esc(n.id) + '"' + (node.parent === n.id ? " selected" : "") + ">" + esc(groupPath(tree, n.id)) + " 안</option>");
        });
        return '<select class="gparent" data-act="sg-parent" data-proj="' + esc(k) + '" data-id="' + esc(node.id) + '" aria-label="' + esc(node.name) + ' 그룹 위치">' + opts.join("") + "</select>";
      }
      function block(node, depth) {
        var rows = list.filter(function (x) { return subOf[sessKey(x.id)] === node.id; });
        var ids = subtreeIds(tree, node.id);
        var inSub = countIn(ids, list), allSub = countIn(ids, byP[k]);
        var kids = kidsOf(tree, node.id);
        var isLeft = node.id === LEFTOVER;
        var renaming = editing && uiState.sRen === node.id;
        var title;
        if (renaming) {
          title = '<input id="sg-ren" class="ginput" data-sgren="' + esc(node.id) + '" data-proj="' + esc(k) + '" value="' + esc(node.name) + '" maxlength="20" aria-label="새 그룹 이름">' +
            '<button class="mini" data-act="sg-ren-ok" data-id="' + esc(k) + '">저장</button><button class="mini" data-act="sg-ren-cancel">취소</button>';
        } else if (editing) {
          var canChild = !isLeft && depthOf(tree, node.id) < MAX_DEPTH;
          title = (isLeft ? '<span class="ggrip off" title="미분류는 항상 마지막입니다">⋮⋮</span>' :
              '<button class="ggrip" type="button" data-gid="' + esc(node.id) + '" aria-label="' + esc(node.name) + " 그룹 옮기기 — 끌거나 ↑↓, ← 밖으로 · → 안으로" + '" title="끌어서 옮기기 — 다른 그룹 가운데에 놓으면 그 안으로">⋮⋮</button>') +
            '<span class="gname">' + esc(node.name) + "</span><span>" + allSub + "</span>" +
            (isLeft ? '<span class="gnote">갈 곳 없는 세션이 모이는 자리</span>' :
              '<button class="mini" data-act="sg-ren" data-proj="' + esc(k) + '" data-id="' + esc(node.id) + '">이름 바꾸기</button>' +
              (canChild ? '<button class="mini" data-act="sg-add" data-id="' + esc(k) + '" data-parent="' + esc(node.id) + '">+ 하위 그룹</button>' : "") +
              parentOptions(node) +
              (allSub || kids.length ? '<span class="gnote">' + (allSub ? "세션이 있어" : "하위 그룹이 있어") + " 삭제 불가</span>" :
                '<button class="mini danger" data-act="sg-del" data-proj="' + esc(k) + '" data-id="' + esc(node.id) + '">삭제</button>'));
        } else {
          title = (isLeft ? "" : '<button class="ggrip" type="button" data-gid="' + esc(node.id) + '" aria-label="' + esc(node.name) + " 그룹 옮기기 — 끌거나 ↑↓, ← 밖으로 · → 안으로" + '" title="끌어서 옮기기 — 다른 그룹 가운데에 놓으면 그 안으로">⋮⋮</button>') +
            '<span class="gname">' + esc(node.name) + "</span><span>" + inSub + "</span>";
        }
        var out = '<div class="ssub' + (inSub || editing ? "" : " empty") + (depth > 1 ? " nested" : "") + '" data-sdrop="' + esc(node.id) + '"><h4>' + title + "</h4>";
        if (editing && uiState.sAdd && uiState.sAdd.k === k && uiState.sAdd.parent === node.id) out += addRow(k, node.id);
        out += (rows.length || kids.length ? "" : '<p class="dropnote">' + (editing ? "비어 있음" : "여기에 놓기") + "</p>");
        out += rows.map(function (x) {
          var key = sessKey(x.id);
          return '<div class="srow3" data-skey="' + esc(key) + '">' +
            '<button class="grip" type="button" aria-label="' + esc((x.title || "") + " 옮기기 — 끌어서 놓거나 ↑↓") + '" title="끌어서 다른 그룹에 놓기">⋮⋮</button>' +
            '<span class="dot ' + (x.running ? "ok live" : "idle") + '" title="' + (x.running ? "실행 중" : "대기") + '"></span>' +
            '<div class="t"><b>' + esc(x.title || x.id) + "</b><span>" + esc(ago(x.lastActivityAt) || "—") + (x.group && x.group !== sessProjectName(k) ? " · " + esc(x.group) : "") + "</span></div>" +
            openLinkHTML(x) + "</div>" +
            (uiState.sNew === key ? '<div class="newsub"><input id="sg-new" data-sgnew="' + esc(key) + '" placeholder="새 그룹 이름 (예: 디자인)" maxlength="20" aria-label="새 그룹 이름">' +
              '<button class="mini" data-act="sg-new-ok" data-id="' + esc(key) + '">추가</button><button class="mini" data-act="sg-new-cancel">취소</button></div>' : "");
        }).join("");
        out += kids.map(function (c) { return block(c, depth + 1); }).join("");
        return out + "</div>";
      }
      kidsOf(tree, null).forEach(function (n) { h += block(n, 1); });
      h += '<div class="ssub empty" data-sdrop="__new"><h4>+ 새 그룹</h4><p class="dropnote">여기에 놓으면 이름을 정합니다</p></div>';
      h += '<div class="ssub groot" data-sdrop="__root"><h4>맨 위 단계로 빼기</h4><p class="dropnote">그룹을 여기에 놓으면 하위에서 빠져 맨 위 단계 끝으로 갑니다</p></div>';

    });
    if (!shown && !uiState.sEdit) h += '<p class="empty">' + (runOnly ? "실행 중인 세션이 없습니다." : "세션이 없습니다.") + "</p>";
    return h;
  }

  /* ---------- group tree writes ---------- */
  function saveTree(k, tree, msg) {
    if (!db) { toast("저장소에 연결되어야 그룹을 바꿀 수 있습니다."); return false; }
    var id = subsDocId(k), prev = SUBS_DOC[k];
    var nodes = tree.filter(function (n) { return n.id !== LEFTOVER; }).map(function (n) { return { id: n.id, name: n.name, parent: n.parent || null }; });
    var doc = { key: k, tree: nodes, subs: nodes.filter(function (n) { return !n.parent; }).map(function (n) { return n.name; }), at: new Date().toISOString() };
    SUBS_DOC[k] = doc; render();
    db.doc("session_subs/" + id).set(doc).then(function () { if (msg) toast(msg); }).catch(function (e) {
      if (prev) SUBS_DOC[k] = prev; else delete SUBS_DOC[k];
      toast(dbMsg(e)); render();
    });
    return true;
  }
  function cleanName(v) { return String(v || "").replace(/\s+/g, " ").trim().slice(0, 20); }
  function siblingNameTaken(tree, parent, name, exceptId) {
    return kidsOf(tree, parent).some(function (n) { return n.name === name && n.id !== exceptId; });
  }
  // Insert a node as the last child of `parent` (before 미분류 at the top level).
  function insertLast(tree, node) {
    var sibs = kidsOf(tree, node.parent);
    var last = sibs.filter(function (n) { return n.id !== LEFTOVER; }).pop();
    var at;
    if (last) { var sub = subtreeIds(tree, last.id); at = Math.max.apply(null, sub.map(function (id) { return tree.indexOf(findNode(tree, id)); })) + 1; }
    else if (node.parent) at = tree.indexOf(findNode(tree, node.parent)) + 1;
    else at = tree.indexOf(findNode(tree, LEFTOVER));
    tree.splice(at, 0, node);
  }
  // Returns the new group's id, or null.
  function addGroup(k, name, parent, quiet) {
    name = cleanName(name);
    parent = parent || null;
    if (!name) { toast("그룹 이름을 적어 주세요."); return null; }
    if (name === LEFTOVER) { toast("«" + LEFTOVER + "» 는 쓸 수 없는 이름입니다."); return null; }
    var tree = treeShown(k);
    if (parent && depthOf(tree, parent) >= MAX_DEPTH) { toast("하위 그룹은 " + MAX_DEPTH + "단계까지 만들 수 있습니다."); return null; }
    if (siblingNameTaken(tree, parent, name)) {
      if (!quiet) toast("같은 자리에 «" + name + "» 그룹이 이미 있습니다.");
      var same = kidsOf(tree, parent).filter(function (n) { return n.name === name; })[0];
      return quiet && same ? same.id : null;
    }
    var id = "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    insertLast(tree, { id: id, name: name, parent: parent });
    return saveTree(k, tree, quiet ? null : "«" + (parent ? groupPath(tree, id) : name) + "» 그룹을 만들었습니다.") ? id : null;
  }
  function renameGroup(k, id, newName) {
    newName = cleanName(newName);
    var tree = treeShown(k), node = findNode(tree, id);
    if (!node) return;
    if (!newName) { toast("그룹 이름을 적어 주세요."); return; }
    if (newName === node.name) { uiState.sRen = null; render(); return; }
    if (newName === LEFTOVER || siblingNameTaken(tree, node.parent, newName, id)) { toast("같은 자리에 «" + newName + "» 그룹이 이미 있습니다."); return; }
    var old = node.name;
    node.name = newName;
    uiState.sRen = null;
