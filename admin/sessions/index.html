<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>세션 별자리 · WMW HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0B0F14;--surface:#141B23;--high:#1A2330;--glass:rgba(20,27,35,.9);
  --line:#243140;--line2:#2A3A4D;
  --text:#E8F4FF;--muted:#8A9BB0;--dim:#5B6878;
  --cyan:#00E5FF;--mint:#00FFC6;--orange:#FFB36C;--red:#FF4D6D;
  --sans:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--cyan)}

.top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;background:rgba(11,15,20,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
/* 관리 화면 탭 줄 — HQ · Solo Climbing 과 같은 줄 (2026-11-13 오너) */
nav.site{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:2px 20px;margin:-10px -16px 4px;padding:0 16px;border-bottom:1px solid var(--line)}
nav.site a{display:inline-flex;align-items:center;min-height:40px;margin-bottom:-1px;font:700 14px/1.25 var(--sans);color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
nav.site a:hover{color:var(--text)}
nav.site a[aria-current=page]{color:var(--text);border-bottom-color:var(--cyan)}
.stat{display:flex;flex-wrap:wrap;gap:6px}
.stat button{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.stat button b{font:600 14px var(--mono);color:var(--text)}
.stat button.on{border-color:var(--text);color:var(--text)}
.use{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 14px}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.meter .bar{width:96px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--mint));transition:width .4s}
.meter.warn .bar i{background:var(--orange)}
.meter.full .bar i{background:var(--red)}
.meter b{font:600 13px var(--mono);color:var(--text)}
.meter small{font:500 11px var(--mono);color:var(--dim)}
.meter.stale{opacity:.5}
/* 음성 비서 «페이» 단추 · 카드 (11-16) — 상태: idle 쉼 · wake 호출어 기다림 · listen 듣는 중 · think 생각 중 · speak 말하는 중 · task 본체가 일하는 중 */
.vb{display:flex;align-items:center;gap:7px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);font-weight:700;font-size:13px}
.vb i{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.vb[data-s=wake] i{background:var(--cyan)}
.vb[data-s=listen]{border-color:var(--red)}
.vb[data-s=listen] i{background:var(--red);animation:vpulse 1s infinite}
.vb[data-s=think] i,.vb[data-s=task] i{background:var(--orange);animation:vpulse 1.4s infinite}
.vb[data-s=speak] i{background:var(--mint);animation:vpulse .8s infinite}
@keyframes vpulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.vb i{animation:none!important}}
.vc{position:fixed;right:16px;top:calc(var(--topH,64px) + 10px);z-index:35;width:min(380px,calc(100vw - 32px));padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--glass);backdrop-filter:blur(10px)}
.vc[hidden]{display:none}
.vh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.vh span{flex:1;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.vh button{color:var(--muted);padding:2px 6px}
.vq{margin:0 0 6px;color:var(--cyan);font-size:14px;overflow-wrap:anywhere}
.va{margin:0 0 10px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.vq:empty,.va:empty{display:none}
.vw{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--muted)}
.relay{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.relay i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.relay.on i{background:var(--mint);box-shadow:0 0 0 3px rgba(0,255,198,.18)}
.relay.off i{background:var(--red)}

.vp{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
.vp.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world.fly{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.sky{position:absolute;left:-4000px;top:-4000px;width:8000px;height:8000px;pointer-events:none;
  background-image:radial-gradient(circle,rgba(138,155,176,.13) 1px,transparent 1.3px),radial-gradient(circle,rgba(232,244,255,.07) 1px,transparent 1.5px);
  background-size:32px 32px,173px 173px;background-position:0 0,40px 70px}
svg.links{position:absolute;overflow:visible;pointer-events:none;left:0;top:0}
.ln{fill:none;transition:opacity .25s}
.ln.run{stroke-dasharray:5 9;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.ln.run{animation:none}.node.st-run .orb::after{animation:none}}

.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:180px;transition:opacity .25s}
.orb{position:relative;width:var(--sz,44px);height:var(--sz,44px);border-radius:50%;background:var(--surface);border:2px solid var(--c);display:grid;place-items:center;font:700 15px var(--mono);color:var(--c);transition:transform .15s,box-shadow .2s}
.node:hover .orb{transform:scale(1.08)}
.node.sel .orb{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--cyan)}
.lb{font-size:13px;font-weight:600;overflow-wrap:anywhere;text-shadow:0 1px 6px var(--bg)}
.sm{font:500 11px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.node.st-run .orb::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid transparent;border-top-color:var(--mint);border-right-color:rgba(0,255,198,.35);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.node.st-wait .orb{border-color:var(--orange);color:var(--orange);background:rgba(255,179,108,.1)}
.node.st-idle .orb{opacity:.8}
.node.dim{opacity:.13}
.ghub .orb{--sz:96px;font:700 14px var(--sans);background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.06),var(--surface) 70%);border-width:2.5px;line-height:1.25;padding:6px;text-align:center}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.bd{font:600 11px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.bd.run{color:var(--mint);border-color:rgba(0,255,198,.4)}
.bd.q{color:var(--orange);border-color:rgba(255,179,108,.5)}
.bd.c{color:var(--cyan);border-color:rgba(0,229,255,.45)}
.hub .orb{--sz:132px;font:700 17px var(--sans);color:var(--cyan);border-color:var(--cyan);background:radial-gradient(circle at 50% 35%,rgba(0,229,255,.16),var(--surface) 70%);box-shadow:0 0 60px rgba(0,229,255,.12)}
/* 멀리서 보면 세션 이름만 감춘다(자리는 그대로 — 별끼리 안 겹치게 재는 상자가 줌에 따라 바뀌지 않게) */
[data-far="1"] .sess .lb,[data-far="1"] .sess .sm,[data-far="1"] .hub .sm{visibility:hidden}
/* 끌어 옮기기 — PC 는 눌러 끌기, 폰은 꾹 눌러 끌기 (2026-11-14 오너) */
.node{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.node.drag{z-index:4}
.node.drag .orb{transform:scale(1.12);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--mint)}

.radial{position:absolute;width:0;height:0;z-index:5}
.radial button,.radial a{position:absolute;transform:translate(-50%,-50%);padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--cyan);font-size:12.5px;white-space:nowrap;animation:pop .2s cubic-bezier(.2,.9,.3,1.3) both;backdrop-filter:blur(6px);color:var(--text);text-decoration:none}
.radial .warn{border-color:var(--orange);color:var(--orange)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.5)}}

.groups{position:fixed;left:16px;bottom:16px;z-index:20;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100vw - 100px)}
.groups button{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:13px;backdrop-filter:blur(8px)}
.groups button.on{border-color:var(--text)}
.groups i{width:8px;height:8px;border-radius:2px;display:inline-block}
.groups small{font:500 11px var(--mono);color:var(--muted)}
.zoom{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;flex-direction:column;gap:4px}
.zoom button{width:36px;height:36px;border-radius:9px;background:var(--glass);border:1px solid var(--line);font:600 16px var(--mono)}
.zoom .lv{font:500 10px var(--mono);text-align:center;color:var(--muted)}

.panel{position:fixed;right:16px;top:calc(var(--topH,64px) + 10px);bottom:72px;z-index:25;width:var(--pw,560px);max-width:calc(100vw - 32px);display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line2);border-radius:14px;backdrop-filter:blur(14px);transform:translateX(calc(100% + 24px));transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.panel.open{transform:none}
.ph{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.gp{font:600 11px var(--mono);letter-spacing:.1em;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.panel h2{margin:6px 30px 4px 0;font-size:19px;overflow-wrap:anywhere}
.x{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:8px;color:var(--muted)}
.st{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.d-run{background:var(--mint)}.d-wait{background:var(--orange)}.d-idle{background:var(--dim)}
.pb{flex:1;overflow:auto;padding:4px 18px 10px}
.panel h4{margin:14px 0 6px;font:600 11px var(--mono);letter-spacing:.1em;color:var(--dim)}
.cv{max-height:46vh;overflow-y:auto;padding-right:4px}
.cv p{margin:0 0 10px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.cv .who small{font-weight:400;opacity:.7;margin-left:4px}
.cv .me{color:var(--cyan)}
.cv.one{max-height:none;overflow:visible;padding-right:0}
.cv .er{margin-top:4px;padding:8px 10px;border-left:2px solid var(--red);background:rgba(255,77,109,.06);border-radius:0 8px 8px 0;white-space:pre-wrap}
.cv .pend{opacity:.85}
.cv .stamp{margin:4px 0 0;font:500 11px var(--mono);color:var(--dim);text-align:right}
.cv .pend .who button{color:var(--muted);text-decoration:underline;font-size:11px}
/* 대화 한 마디 — AI 답은 마크다운을 앱처럼 그린다 (2026-11-15 오너) */
.cv .tk{margin:0 0 14px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.cv .tk .who{display:block;margin-bottom:3px}
.cv .tk.me .md{color:var(--cyan)}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 8px}
.md h1,.md h2,.md h3,.md h4,.md h5{margin:12px 0 6px;font:700 14px/1.4 var(--sans);letter-spacing:0;color:var(--text,#e8eef5)}
.md h1{font-size:16px}.md h2{font-size:15px}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}.md li{margin:2px 0}
.md strong{font-weight:700;color:var(--text,#fff)}
.md code{font:12px var(--mono);background:rgba(255,255,255,.07);border-radius:4px;padding:1px 4px}
.md pre{margin:0 0 8px;padding:8px 10px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;overflow-x:auto;white-space:pre}
.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 8px;padding:2px 10px;border-left:3px solid var(--line2);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.md .tw{overflow-x:auto;margin:0 0 8px}
.md table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.md th,.md td{border:1px solid var(--line2);padding:5px 8px;text-align:left;vertical-align:top}
.md th{background:rgba(255,255,255,.05);font-weight:700}
.md a{color:var(--cyan)}
/* 카드 왼쪽 가장자리를 끌어 폭을 바꾼다 (PC) */
.rz{position:absolute;left:-4px;top:12px;bottom:12px;width:8px;cursor:ew-resize;z-index:2;border-radius:4px}
.rz:hover,.rz.on{background:rgba(120,200,255,.25)}
@media (max-width:700px){.rz{display:none}}
.who{font:600 11px var(--mono);color:var(--dim);margin-right:6px}
.note{background:rgba(255,179,108,.08);border:1px solid rgba(255,179,108,.3);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
.arts summary{cursor:pointer;list-style:none}
.arts summary::-webkit-details-marker{display:none}
.arts summary h4{display:inline}
.arts summary h4::after{content:' ▾';color:var(--dim)}
.arts:not([open]) summary h4::after{content:' ▸'}
.arts ul{margin:6px 0 10px;padding:0;list-style:none}
.arts li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06);overflow-wrap:anywhere}
.arts li a{color:var(--mint);text-decoration:none;flex:1 1 auto;min-width:0}
.arts li a:hover{text-decoration:underline}
.arts li small{font:500 11px var(--mono);color:var(--dim)}
.lg{margin:0;padding:0;list-style:none}
.lg li{font-size:13px;margin-bottom:12px;overflow-wrap:anywhere}
.lg .tx{white-space:pre-wrap}
.lg .rp{margin-top:6px;padding:8px 10px;border-left:2px solid var(--mint);background:rgba(0,255,198,.05);border-radius:0 8px 8px 0;color:var(--text)}
.lg .er{margin-top:6px;padding:8px 10px;border-left:2px solid var(--red);background:rgba(255,77,109,.06);border-radius:0 8px 8px 0;white-space:pre-wrap}
.lg .meta{font:500 11px var(--mono);color:var(--dim);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lg .meta button{color:var(--muted);text-decoration:underline}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.steps span{font:500 10.5px var(--mono);padding:1px 6px;border-radius:5px;background:var(--high);color:var(--dim)}
.steps .done{background:rgba(0,229,255,.12);color:var(--cyan)}
.steps .bad{background:rgba(255,77,109,.14);color:var(--red)}
.mem{display:flex;flex-direction:column;gap:6px}
.mem button{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-size:13px}
.mem button:hover{border-color:var(--muted)}
.mem small{margin-left:auto;font:500 11px var(--mono);color:var(--dim);white-space:nowrap}
.cp{padding:12px 18px 16px;border-top:1px solid var(--line)}
.to{font-size:12px;color:var(--muted);margin-bottom:6px;overflow-wrap:anywhere}
.to b{color:var(--text)}
textarea{width:100%;min-height:68px;resize:vertical;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:14px/1.45 var(--sans)}
textarea:focus{outline:none;border-color:var(--cyan)}
.rw{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.send{margin-left:auto;padding:7px 16px;border-radius:9px;background:var(--cyan);color:#041016;font-weight:700}
.send:disabled{opacity:.4;cursor:default}
.send:active{transform:scale(.97)}
.toast{position:fixed;left:50%;top:calc(var(--topH,64px) + 8px);z-index:40;transform:translate(-50%,-10px);opacity:0;background:var(--high);border:1px solid var(--cyan);padding:9px 14px;border-radius:10px;font-size:13px;transition:.2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}

#gate{position:fixed;inset:var(--topH,64px) 0 0 0;z-index:28;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{max-width:360px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:28px 24px;text-align:center}
#gate b{display:block;font:700 15px var(--mono);letter-spacing:.14em}
#gate button{margin-top:22px;width:100%;padding:11px 14px;border-radius:7px;background:var(--cyan);color:#041016;font-weight:700}
#gate p{margin:14px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
/* ── 폰(폭 700px 아래) — 2026-11-14 오너 «별자리로, 모바일 최적화» (시안 v2) ──
   위 띠는 두 줄, 별자리는 세로로 길게, 별은 손가락 크기, 세션은 오른쪽 칸 대신 아래 카드(끌어올리면 화면 전체) */
.grab{display:none}
@media (max-width:700px){
  .top{gap:6px 8px;padding:8px 12px}
  nav.site{margin:-8px -12px 2px;padding:0 12px}
  .relay,.use{margin-left:0}
  .relay{order:1;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:11.5px}
  .use{order:2;gap:6px}
  .stat{order:3;flex:1 1 100%}
  .meter{padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;gap:6px}
  .meter .bar{width:34px;height:4px}
  .meter b{font-size:12px}
  .meter small{display:none}
  .stat button{padding:5px 10px;font-size:12px}
  .stat button b{font-size:13px}
  .zoom{display:none}
  .groups{left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:none}
  .groups button{padding:6px 11px;font-size:12.5px}
  /* 폰 배치는 화면 크기 그대로(별 사이 거리를 화면 픽셀로 잡음) — 별은 손가락 크기, 이름은 늘 보이게 */
  .node{width:112px;gap:4px}
  .orb{font-size:13px}
  .lb{font-size:12px;line-height:1.25}
  .sess .sm{display:none}
  .ghub .orb{--sz:70px;font-size:11.5px;padding:4px}
  .hub .orb{--sz:78px;font-size:14px}
  .hub .sm{font:500 10.5px var(--sans)}
  .node.hub{width:190px}
  .radial{display:none}
  .panel{left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;height:min(56vh,480px);border-radius:20px 20px 0 0;border-width:1px 0 0;background:rgba(20,27,35,.98);box-shadow:0 -20px 40px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1)}
  .panel.open{transform:none}
  .panel.full{height:calc(100vh - var(--topH,64px));height:calc(100dvh - var(--topH,64px))}
  .grab{display:block;flex:none;height:24px;touch-action:none;cursor:grab;position:relative}
  .grab::before{content:"";position:absolute;left:50%;top:9px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line2)}
  .x{top:26px}

<script>
/*
 * 세션 별자리 — 사내 홈페이지 웹판의 한 쪽.
 *   읽기: feed/sessions  (이 PC 의 중계 relay.js 가 20초마다 올림)
 *   쓰기: commands/<자동 id> = { to:{kind:'session', id}, text, report, state:'sent', createdAt }
 *   중계가 그 세션에 한 턴으로 넣고 상태(received → queued → working → done/failed)와 답을 적는다.
 * 정본: WMW/공통/HQ/web/sessions/ · 설명: 공통/HQ/README.md «세션 별자리»
 */
const CONFIG = {
  apiKey: "AIzaSyAjF8hR6dHgIBD5-_AzSu5qRcLN46jPvKI",
  authDomain: "wmw-hq.firebaseapp.com",
  projectId: "wmw-hq",
  storageBucket: "wmw-hq.firebasestorage.app",
  messagingSenderId: "953566283020",
  appId: "1:953566283020:web:b8b505a01ff9d90870f529"
};
const app = firebase.initializeApp(CONFIG), auth = app.auth(), fs = app.firestore();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 로그인은 /admin 에서 한 번 (2026-11-13 오너) — 여기는 같은 wmw-hq 기본 앱이라 HQ 로그인을 그대로 받는다
auth.onAuthStateChanged(u => {
  if (!u) { location.replace('/admin/?next=/admin/sessions/'); return; }
  fs.doc('feed/sessions').onSnapshot(s => { $('gate').style.display = 'none'; onFeed(s.exists ? s.data() : null); },
    e => { $('gateMsg').textContent = e.code === 'permission-denied' ? '이 계정은 열 수 없습니다 (오너 계정만).' : '읽지 못했습니다: ' + e.message; $('gate').style.display = 'flex'; });
  fs.doc('feed/usage').onSnapshot(s => { USAGE = s.exists ? s.data() : null; renderUsage(); }, () => {});
  fs.collection('commands').orderBy('createdAt', 'desc').limit(120).onSnapshot(s => { CMDS = s.docs.map(d => ({ id: d.id, ...d.data() })); refreshPanel(); renderStat(); }, () => {});
});

/* ───────── 자료 ───────── */
const MOB = () => matchMedia('(max-width:700px)').matches;   // 폰 화면 (CSS 의 700px 와 같은 선)
const PALETTE = ['#8A6DFF', '#00E5FF', '#00FFC6', '#FF6FB0', '#FFB36C', '#7CC4FF', '#C9F26B'];
let G = [], S = [], CMDS = [], RELAY = null, HIDDEN = null;
const gOf = id => G.find(g => g.id === id) || G[G.length - 1];
const stTxt = { run: '작업 중', wait: '앱에서 내 답 기다림', idle: '대기' };
const ago = t => { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return '방금'; if (m < 60) return m + '분 전'; const h = Math.round(m / 60); if (h < 24) return h + '시간 전'; return Math.round(h / 24) + '일 전'; };
const appLink = id => 'claude://claude.ai/epitaxy/' + id;
const cmdsOf = id => CMDS.filter(c => c.to && c.to.id === id);
const openCmds = id => cmdsOf(id).filter(c => ['sent', 'received', 'queued', 'working'].includes(c.state));

function onFeed(d) {
  if (!d) { $('empty').textContent = '아직 세션 자료가 없습니다 — PC 에서 relay.js 를 켜 주세요'; return; }
  $('empty').style.display = 'none';
  RELAY = d.relay || null; HIDDEN = d.hidden || null;
  const groups = (d.groups || []).filter(g => (d.sessions || []).some(s => s.group === g.id));
  if ((d.sessions || []).some(s => !s.group || !groups.some(g => g.id === s.group))) groups.push({ id: '_', name: '묶음 없음' });
  G = groups.map((g, i) => ({ ...g, c: PALETTE[i % PALETTE.length] }));
  S = (d.sessions || []).map(s => ({ ...s, g: groups.some(g => g.id === s.group) ? s.group : '_' }));
  const sig = (MOB() ? 'm|' : '') + G.map(g => g.id).join() + '|' + S.map(s => s.id + s.g + (s.parent || '')).join();
  if (sig !== layoutSig) {
    layout(); layoutSig = sig; draw();
    // 처음에는 화면에 그리기 전에 다 풀어 놓고 맞춘다 — 그 뒤 새 별이 생기면 움직이며 자리를 찾는다
    if (!fitted) {
      fitted = true; settle(); fit(allBounds(), false);
      // 새 판으로 다시 불러왔으면 보던 카드를 다시 연다
      let back = null; try { back = sessionStorage.getItem('wmw.sessions.open'); sessionStorage.removeItem('wmw.sessions.open'); } catch { /* */ }
      if (back && S.some(s => s.id === back)) setTimeout(() => openSession(back), 0);
    } else kick(.6);
  } else { draw(); kick(.12); }
  renderStat(); renderGroups(); renderRelay(); refreshPanel();
}

/* ───────── 조직도 자리 (2026-11-15 오너 «조직도처럼 아래로 뻗는 것을 별자리 UI 로, 위치 조정 가능하게») ─────────
 * 앱 사이드바 묶음이 정본: «비서실» 은 대표 옆, «프로젝트 · ○○» 는 «프로젝트» 별 아래 월드, 그 밖은 부서.
 * 대표 → 부서 · 프로젝트 → 월드 → 세션 줄기 차례로 위에서 아래로 놓는다. 끌어 옮긴 별의 자리는 이 브라우저에 기억한다 */
const PROJ = /^프로젝트\s*·\s*/;
const isWorld = g => PROJ.test(g.name);
const gName = g => g.id === '_' ? '묶음 없음' : isWorld(g) ? g.name.replace(PROJ, '') : g.name;
const DEPT_ORDER = ['경영지원', '프로젝트', '콘텐츠·브랜드'];
const WORLD_ORDER = ['업무창', 'FACEWORLD', 'Solo Climbing', 'Sketch 2D', 'Rhythm Blade', 'WELLMONSTER'];   // PROJECT 폴더 번호 차례
const wRank = g => { const i = WORLD_ORDER.indexOf(gName(g).trim()); return i < 0 ? 99 : i; };
const dRank = n => { const i = DEPT_ORDER.indexOf(n); return n === '묶음 없음' ? 99 : i < 0 ? 50 : i; };
const POS_KEY = 'wmw.sessions.treepos';
let SAVED = {};
try { SAVED = JSON.parse(localStorage.getItem(POS_KEY) || '{}') || {}; } catch (_) { SAVED = {}; }
const savePos = () => { try { localStorage.setItem(POS_KEY, JSON.stringify(SAVED)); } catch (_) {} };

/* ───────── 배치: 오너 → 묶음 → 세션 → 갈래 ─────────
 * 둥글게 놓고 시작해 힘으로 푼다(2026-11-14 오너 «옵시디언처럼 절대 겹치지 않게 유기적으로»).
 * 선은 용수철, 별끼리는 서로 밀고, 별 + 이름 상자가 겹치면 바로 떼어 놓는다. 오너 별만 가운데 고정.
 * 이미 자리 잡은 별은 자료가 새로 와도 그 자리에서 이어 움직인다 */
let pos = {}, layoutSig = '', fitted = false, LEN = {};
function layout() {
  const m = MOB();
  LEN = { g: 0, s: 0, c: 0 };
  pos = { o: { x: 0, y: 0, fixed: true } };
  const sec = G.find(g => g.name.trim() === '비서실');
  const worlds = G.filter(isWorld).sort((a, b) => wRank(a) - wRank(b));
  const top = G.filter(g => g !== sec && !isWorld(g)).map(g => ({ k: 'g:' + g.id, g, n: gName(g) }));
  if (worlds.length) top.push({ k: 'p', n: '프로젝트' });
  top.sort((a, b) => dRank(a.n) - dRank(b.n));
  const sessOf = gid => { // 줄기 차례 — 원래 세션 다음에 그 갈래
    const list = S.filter(s => s.g === gid), inG = id => list.some(s => s.id === id), out = [];
    const walk = (s, d) => { out.push([s, d]); if (d < 3) list.filter(c => c.parent === s.id).sort((a, b) => b.last - a.last).forEach(c => walk(c, d + 1)); };
    list.filter(s => !(s.parent && inG(s.parent))).sort((a, b) => a.order - b.order || b.last - a.last).forEach(s => walk(s, 0));
    return out;
  };
  if (m) {
    // 폰 — 같은 나무를 왼쪽 줄기에서 오른쪽으로 들여 쓴다(위 → 아래 차례 그대로)
    const IND = 46, STEP = 92; let y = 0;
    const put = (k, d) => { y += STEP; pos[k] = { x: d * IND, y }; };
    if (sec) { put('g:' + sec.id, 1); sessOf(sec.id).forEach(([s, d]) => put(s.id, 2 + d)); }
    for (const t of top) {
      if (t.k === 'p') { put('p', 1); worlds.forEach(w => { put('g:' + w.id, 2); sessOf(w.id).forEach(([s, d]) => put(s.id, 3 + d)); }); }
      else { put(t.k, 1); sessOf(t.g.id).forEach(([s, d]) => put(s.id, 2 + d)); }
    }
  } else {
    // PC — 맨 아래 줄기 수만큼 칸을 나눠 가로로 펼친다(부서 1칸, 프로젝트는 월드 수만큼)
    const COL = 230, ROW = 200, STEP = 112, IND = 34;
    const total = top.reduce((n, t) => n + (t.k === 'p' ? worlds.length : 1), 0);
    let x = -(total - 1) * COL / 2;
    const column = (gid, cx, y0) => sessOf(gid).forEach(([s, d], i) => { pos[s.id] = { x: cx + IND * (d + 1), y: y0 + i * STEP }; });
    for (const t of top) {
      if (t.k === 'p') {
        const x0 = x;
        worlds.forEach(w => { pos['g:' + w.id] = { x, y: ROW * 2 }; column(w.id, x, ROW * 2 + 140); x += COL; });
        pos.p = { x: (x0 + x - COL) / 2, y: ROW };
      } else { pos[t.k] = { x, y: ROW }; column(t.g.id, x, ROW + 140); x += COL; }
    }
    if (sec) { const sx = Math.max(COL * 1.2, (pos.p ? pos.p.x : 0) + COL * .5); pos['g:' + sec.id] = { x: sx, y: 0 }; sessOf(sec.id).forEach(([s], i) => { pos[s.id] = { x: sx + 150 * (i + 1), y: 0 }; }); }
  }
  S.forEach(s => { if (!pos[s.id]) { const hb = pos['g:' + s.g] || pos.o; pos[s.id] = { x: hb.x + 40, y: hb.y + 140 }; } });
  // 끌어 옮겨 둔 별은 그 자리로 (폰 · PC 따로 기억)
  const mine = SAVED[m ? 'm' : 'd'] || {};
  for (const k in pos) { const sv = mine[k]; if (sv && k !== 'o') { pos[k].x = sv.x; pos[k].y = sv.y; } pos[k].vx = 0; pos[k].vy = 0; }
}

/* ───────── 힘 ───────── */
let BOX = {}, NODE = {}, LINKS = [], alpha = 0, simOn = false, DRAGP = null;
const TREE = true;   // 조직도 자리 (11-15) — false 로 두면 예전 힘 배치
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const parentKey = s => s.parent && pos[s.parent] && S.find(x => x.id === s.parent)?.g === s.g ? s.parent : 'g:' + s.g;
function simStep() {
  const ks = Object.keys(pos), m = MOB(), CHARGE = m ? 2500 : 6000;
  if (TREE) { for (const k of ks) { const p = pos[k]; p.vx = p.vy = 0; } collide(2); return; }   // 조직도 자리 — 겹침만 떼어 놓는다
  for (const l of LINKS) {                                   // 용수철 — 선 길이를 제 길이로
    const a = pos[l.a], b = pos[l.b]; if (!a || !b) continue;
    let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || 1, f = (d - l.len) / d * .1 * alpha;
    dx *= f; dy *= f;
    if (!a.fixed && a !== DRAGP) { a.vx += dx / 2; a.vy += dy / 2; }
    if (!b.fixed && b !== DRAGP) { b.vx -= dx / 2; b.vy -= dy / 2; }
  }
  for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) {   // 서로 밀기
    const a = pos[ks[i]], b = pos[ks[j]]; let dx = b.x - a.x, dy = b.y - a.y;
    if (!dx && !dy) { dx = Math.random() - .5; dy = Math.random() - .5; }
    const d2 = Math.max(dx * dx + dy * dy, 900), f = Math.min(CHARGE * alpha / d2, 30) / Math.sqrt(d2);
    if (!a.fixed && a !== DRAGP) { a.vx -= dx * f; a.vy -= dy * f; }
    if (!b.fixed && b !== DRAGP) { b.vx += dx * f; b.vy += dy * f; }
  }
  for (const k of ks) { const p = pos[k]; if (p.fixed || p === DRAGP) { p.vx = p.vy = 0; continue; } p.vx *= .58; p.vy *= .58; p.x += p.vx; p.y += p.vy; }
  collide(2);
}
/** 별 + 이름 상자가 겹치면 덜 겹친 쪽(가로/세로)으로 바로 떼어 놓는다 — 힘이 아니라 규칙이다 */
function collide(passes) {
  const ks = Object.keys(pos), M = MOB() ? 10 : 16;
  let any = false;
  for (let n = 0; n < passes; n++) {
    any = false;
    for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) {
      const A = pos[ks[i]], B = pos[ks[j]], a = BOX[ks[i]], b = BOX[ks[j]]; if (!a || !b) continue;
      const dx = B.x - A.x, dy = B.y - A.y, ox = (a.w + b.w) / 2 + M - Math.abs(dx), oy = (a.h + b.h) / 2 + M - Math.abs(dy);
      if (ox <= 0 || oy <= 0) continue;
      any = true;
      const la = A.fixed || A === DRAGP, lb = B.fixed || B === DRAGP, wa = la ? 0 : lb ? 1 : .5, wb = lb ? 0 : la ? 1 : .5;
      if (ox < oy) { const s = dx >= 0 ? 1 : -1; A.x -= s * ox * wa; B.x += s * ox * wb; }
      else { const s = dy >= 0 ? 1 : -1; A.y -= s * oy * wa; B.y += s * oy * wb; }
    }
    if (!any) break;
  }
  return any;
}
/** 그리기 전에 끝까지 푼다 — 처음 열 때 · 움직임 줄이기를 켠 기기 */
function settle() {
  alpha = 1; for (let i = 0; i < 320; i++) { simStep(); alpha *= .985; }
  for (let i = 0; i < 40 && collide(10); i++);
  alpha = 0; place();
}
function kick(a) {
  if (REDUCE && !DRAGP) { settle(); return; }
  alpha = Math.max(alpha, a);
  if (!simOn) { simOn = true; requestAnimationFrame(loop); }
}
function loop() {
  simStep(); alpha *= .965; place();
  if (alpha > .008 || DRAGP) requestAnimationFrame(loop);
  else { for (let i = 0; i < 40 && collide(10); i++); place(); simOn = false; }
}
function place() {
  for (const k in NODE) { const p = pos[k]; if (!p) continue; NODE[k].style.left = p.x + 'px'; NODE[k].style.top = p.y + 'px'; }
  for (const l of LINKS) {
    const a = pos[l.a], b = pos[l.b]; if (!a || !b || !l.el) continue;
    if (TREE) {
      const rail = MOB() || !(l.b === 'p' || l.b.startsWith('g:'));
      l.el.setAttribute('d', rail ? `M${a.x} ${a.y} V${b.y} H${b.x}` : `M${a.x} ${a.y} V${(a.y + b.y) / 2} H${b.x} V${b.y}`);
      continue;
    }
    if (l.a === 'o') { l.el.setAttribute('d', `M${a.x} ${a.y} L${b.x} ${b.y}`); continue; }
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, cx = mx - (b.y - a.y) * .12, cy = my + (b.x - a.x) * .12;
    l.el.setAttribute('d', `M${a.x} ${a.y} Q${cx} ${cy} ${b.x} ${b.y}`);
  }
  const rd = $('radial'); if (rd && !rd.hidden && cur && cur.k === 's' && pos[cur.id]) { rd.style.left = pos[cur.id].x + 'px'; rd.style.top = pos[cur.id].y + 'px'; }
}

/* ───────── 그리기 ───────── */
const world = $('world'), vp = $('vp');
let focusG = null, filt = null, cur = null;
function draw() {
  let L = '', N = '';
  LINKS = [];
  G.forEach(g => {
    const list = S.filter(s => s.g === g.id), anyRun = list.some(s => s.st === 'run');
    LINKS.push({ a: isWorld(g) && pos.p ? 'p' : 'o', b: 'g:' + g.id, len: LEN.g });
    L += `<path data-grp="${g.id}" data-lk="${LINKS.length - 1}" class="ln ${anyRun ? 'run' : ''}" stroke="${g.c}" stroke-opacity="${anyRun ? .75 : .3}" stroke-width="2" ${anyRun ? '' : 'stroke-dasharray="3 9"'}/>`;
    const run = list.filter(s => s.st === 'run').length, w = list.filter(s => s.st === 'wait').length, oc = list.filter(s => openCmds(s.id).length).length;
    N += `<button class="node ghub" data-g="${g.id}" data-grp="${g.id}" data-k="g:${g.id}" style="--c:${g.c}"><span class="orb">${esc(gName(g))}</span>
      <span class="badges"><span class="bd">${list.length}</span>${run ? `<span class="bd run">▶ ${run}</span>` : ''}${w ? `<span class="bd q">? ${w}</span>` : ''}${oc ? `<span class="bd c">✉ ${oc}</span>` : ''}</span></button>`;
  });
  S.forEach(s => {
    const g = gOf(s.g), pk = parentKey(s);
    LINKS.push({ a: pk, b: s.id, len: pk.startsWith('g:') ? LEN.s : LEN.c });

  const o = e.target.closest('[data-open]'); if (o) { openSession(o.dataset.open); fit(boundsOf([o.dataset.open], 260), true); return; }
  const c = e.target.closest('[data-cancel]');
  if (c) { try { await fs.doc('commands/' + c.dataset.cancel).update({ state: 'cancelled', 'at.cancelled': new Date().toISOString() }); toast('취소했습니다'); } catch (er) { toast('취소하지 못했습니다: ' + (er.code || er.message)); } }
});
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3200); }

/* ───────── 음성 비서 «페이» (2026-11-16 오너 «빅스비처럼 이름 부르면 응답») ─────────
 * 말 → 글(브라우저 내장 한국어 인식) → commands{to:{kind:'voice'}} → PC 중계 voice.js 가 가벼운 모델로 바로 답하거나
 * 실제 일이면 PA 세션에 넘긴다(voice.child) → 답을 소리로 읽는다(브라우저 내장 한국어 음성). PA 일이 끝나면 첫 문장을 읽어 준다.
 * 호출어는 이 화면이 앞에 켜져 있을 때만 듣는다 — 폰은 잠금 · 다른 앱에서 웹페이지 마이크를 막는다(앱 단계에서 푼다) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const V = { rec: null, mode: 'idle', wake: false, armed: 0, speaking: false };
// 호출어는 말 맨 앞의 «페이» 한 단어만 — «페이지» · «카카오페이» · «페이스북» 에는 깨지 않는다 (11-16 오너)
const WAKE = /^\s*(페이|패이|폐이)(야|아)?(?![가-힣A-Za-z0-9])[\s,.!?~]*/;
const vMsg = { idle: '눌러서 말하기', wake: '«페이» 라고 부르세요', listen: '듣는 중 — 말씀하세요', think: '생각하는 중', speak: '말하는 중 — 누르면 멈춤', task: '페이 본체가 일하는 중 — 끝나면 말로 알려 드려요' };
function vSet(s, msg) { V.mode = s; $('vb').dataset.s = s; $('vst').textContent = msg || vMsg[s]; }
function recStop() { const r = V.rec; V.rec = null; if (r) try { r.abort(); } catch { /* */ } }
function recStart(continuous) {
  if (!SR) { $('vc').hidden = false; vSet('idle', '이 브라우저는 말 받아 적기를 못 해요 — 크롬에서 열어 주세요'); return; }
  recStop();
  const r = new SR(); r.lang = 'ko-KR'; r.continuous = continuous; r.interimResults = true;
  r.onresult = e => {
    let fin = '', mid = '';
    for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else mid += t; }
    if (mid && V.mode === 'listen') $('vq').textContent = mid;
    if (fin.trim()) onHeard(fin.trim());
  };
  r.onerror = e => { if (/not-allowed|service-not-allowed/.test(e.error)) { V.wake = false; $('vwk').checked = false; vSet('idle', '마이크를 쓸 수 없어요 — 주소창 옆에서 마이크를 허락해 주세요'); } };
  r.onend = () => {
    if (V.rec !== r) return; V.rec = null;
    if (V.speaking || V.mode === 'think') return;
    if (V.wake && !document.hidden) setTimeout(() => { if (V.wake && !V.rec && !V.speaking && V.mode !== 'think') recStart(true); }, 300);
    else if (V.mode === 'listen') vAfter();
  };
  V.rec = r; try { r.start(); } catch { /* 이미 듣는 중 */ }
}
function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(.15, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .18);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .2); } catch { /* */ }
}
function onHeard(t) {
  if (V.mode === 'listen' || Date.now() < V.armed) { V.armed = 0; const m = WAKE.exec(t); const rest = m && m.index === 0 ? t.slice(m[0].length).trim() : t; if (rest) vSend(rest); return; }
  if (V.mode !== 'wake') return;
  const m = WAKE.exec(t); if (!m) return;
  const rest = t.slice(m.index + m[0].length).trim();
  $('vc').hidden = false;
  if (rest.length >= 2) { vSend(rest); return; }
  beep(); V.armed = Date.now() + 8000; vSet('listen', '네, 말씀하세요');
  setTimeout(() => { if (V.mode === 'listen' && V.wake && Date.now() >= V.armed) vSet('wake'); }, 8200);
}
function vAfter() { if (V.wake) { vSet('wake'); if (!V.rec) recStart(true); } else vSet('idle'); }
// 말하기 줄 — 문장이 오는 대로 차례로 읽고, 다 읽으면 whenQuiet 에 맡긴 일을 한다
const VQ = { n: 0, after: null };
function sayChunk(text) {
  if (!('speechSynthesis' in window) || !text) return;
  recStop(); V.speaking = true; $('vb').dataset.s = 'speak';
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 1.08;
  const ko = speechSynthesis.getVoices().find(v => /^ko/i.test(v.lang)); if (ko) u.voice = ko;
  VQ.n++;
  u.onend = u.onerror = () => { if (--VQ.n > 0) return; VQ.n = 0; V.speaking = false; const f = VQ.after; VQ.after = null; if (f) f(); };
  speechSynthesis.speak(u);
}
function whenQuiet(f) { if (VQ.n === 0) { V.speaking = false; f(); } else VQ.after = f; }
function speak(text, done) { sayChunk(text); whenQuiet(done || (() => {})); }
// PA 답(마크다운)을 소리로 — 코드 · 표 · 기호를 걷고 앞의 두 문장만
function spoken(md) {
  const t = String(md || '').replace(/```[\s\S]*?```/g, ' ').split('\n').filter(l => !/^\s*\|/.test(l)).join(' ')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[`*_#>]|^\s*[-+]\s+/gm, '').replace(/\s+/g, ' ').trim();
  const s = t.match(/[^.!?]+[.!?]?/g) || [t];
  return s.slice(0, 2).join(' ').trim();
}
async function vSend(text) {
  recStop(); $('vq').textContent = text; $('va').textContent = '';
  sayChunk('네');   // 알아들었다는 대답부터 — 시리 · 빅스비처럼 기다리는 느낌을 없앤다
  vSet('think');
  const ref = fs.collection('commands').doc();
  try { await ref.set({ to: { kind: 'voice' }, text, state: 'sent', createdAt: firebase.firestore.FieldValue.serverTimestamp(), from: 'voice-page' }); }
  catch (e) { $('va').textContent = '보내지 못했어요: ' + (e.code || e.message); whenQuiet(vAfter); return; }
  let got = false, said = 0;
  // 중계가 글자가 나오는 대로 partial 에 적는다 — 문장이 끝날 때마다 바로 읽는다
  const off = ref.onSnapshot(s => {
    const d = s.data(); if (!d) return;
    const end = ['done', 'failed'].includes(d.state);
    const full = end ? (d.reply || d.error || '답이 비었어요') : (d.partial || '');
    if (full) $('va').textContent = full;
    let upto = full.length;
    if (!end) { const m = [...full.matchAll(/[.!?](\s|$)/g)].pop(); upto = m ? m.index + 1 : 0; }
    if (upto > said) { const chunk = full.slice(said, upto).trim(); said = upto; sayChunk(chunk); }
    if (!end) return;
    got = true; off();
    whenQuiet(() => { if (d.voice && d.voice.child) watchChild(d.voice.child); else vAfter(); });
  }, () => {});
  setTimeout(() => { if (got) return; off(); $('va').textContent = 'PC 중계가 답하지 않아요 — PC 가 켜져 있는지 봐 주세요'; vAfter(); }, 45 * 1000);
}
function watchChild(id) {
  vAfter(); if (!V.wake) vSet('task');
  const off = fs.doc('commands/' + id).onSnapshot(s => {
    const d = s.data(); if (!d || !['done', 'failed', 'cancelled'].includes(d.state)) return;
    off();
    const say = d.state === 'done' ? spoken(d.reply) || '일을 마쳤어요' : '맡긴 일이 ' + (d.state === 'failed' ? '실패했어요. ' + spoken(d.error) : '취소됐어요');
    $('vq').textContent = '맡긴 일: ' + (d.text || ''); $('va').textContent = say; $('vc').hidden = false;
    speak('페이 본체 답이에요. ' + say, vAfter);
  }, () => {});
}
$('vb').addEventListener('click', () => {
  if (V.speaking) { speechSynthesis.cancel(); return; }
  $('vc').hidden = false;
  if (V.mode === 'listen' && !V.wake) { recStop(); vAfter(); return; }
  V.armed = 0; vSet('listen'); $('vq').textContent = ''; $('va').textContent = '';
  recStart(V.wake);   // 호출어 듣기 중이면 이어 듣고, 아니면 한 번만 듣는다
});
$('vx').addEventListener('click', () => { $('vc').hidden = true; if (!V.wake) { recStop(); if (V.speaking) speechSynthesis.cancel(); vSet('idle'); } });
$('vwk').addEventListener('change', e => {
  V.wake = e.target.checked; try { localStorage.setItem('wmw.voice.wake', V.wake ? '1' : ''); } catch { /* */ }
  if (V.wake) { vSet('wake'); recStart(true); } else { recStop(); vSet('idle'); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && V.wake && !V.rec && !V.speaking && V.mode !== 'think') recStart(true); });
try { if (localStorage.getItem('wmw.voice.wake')) { $('vwk').checked = true; V.wake = true; vSet('wake'); setTimeout(() => recStart(true), 1500); } } catch { /* */ }
if ('speechSynthesis' in window) speechSynthesis.getVoices();   // 목소리 목록을 미리 불러 둔다

world.addEventListener('click', e => {
  if (moved || dragged) { dragged = false; return; }   // 끌어 옮긴 뒤 손을 뗀 것은 누르기가 아니다
  const ra = e.target.closest('[data-ra]'); if (ra) { closeRadial(); openSession(ra.dataset.rid); if (ra.textContent === '지시하기') $('msg').focus(); return; }
  // 세션을 누르면 메뉴 없이 바로 그 세션이 열리고 입력 칸에 커서 — 앱과 같은 방향 (2026-11-15 오너). «앱에서 열기» 는 카드 머리에 있다
  const s = e.target.closest('[data-s]'); if (s) { openSession(s.dataset.s); const m = $('msg'); if (!m.disabled) m.focus({ preventScroll: true }); return; }
  const g = e.target.closest('[data-g]');
  if (g) {   // 세션이 하나뿐인 묶음(비서실 = PA 등)은 묶음 대신 그 세션을 바로 연다
    const one = S.filter(s => s.g === g.dataset.g);
    if (one.length === 1) openSession(one[0].id); else openGroup(g.dataset.g);
    return;
  }
  if (e.target.closest('[data-o]')) { const sec = secretary(); if (sec) openSession(sec.id); else openOwner(); }   // 오너 별 = 페이에게 맡기기 = PA 와의 대화 하나 (11-15 «하나로 해야지»)
});
const setTopH = () => document.documentElement.style.setProperty('--topH', $('top').offsetHeight + 'px');
setTopH(); new ResizeObserver(setTopH).observe($('top'));
let wasMob = MOB();
addEventListener('resize', () => {
  if (!Object.keys(pos).length) return;
  // 폰 ↔ PC 폭을 넘나들면 배치(세로로 길게 / 둥글게)를 다시 한다
  if (MOB() !== wasMob) { wasMob = MOB(); layout(); layoutSig = ''; draw(); settle(); }
  fit(focusG ? groupBounds(focusG) : allBounds(), false);
});
</script>
