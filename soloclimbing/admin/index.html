<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solo Climbing 문의함</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08080B">
<link rel="icon" href="../favicon.ico" sizes="32x32">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 오너 전용 문의함 — 홈페이지 문의(Firestore inquiries)를 모아 본다. 읽기는 보안 규칙이 오너 계정에만 연다 */
:root{--bg:#08080B;--win:#0C0A15;--surface:#131318;--raised:#1B1B22;--line:#2A2A34;--text:#EDEDF2;--text2:#A8A8B8;--text3:#7A7A8C;--accent:#A78FFF;--primary:#6E4BFF;--edge:#8A6AFF;
 --bug:#F97066;--idea:#53B1FD;--gym:#32D583;--etc:#A8A8B8;--font:"Pretendard",system-ui,-apple-system,"Malgun Gothic",sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--font);letter-spacing:-.2px;word-break:keep-all;-webkit-font-smoothing:antialiased}
body{padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
main{max-width:760px;margin:0 auto;display:grid;gap:16px}
/* 대시보드는 숫자를 견주어 보는 화면이라 넓을수록 좋다. 문의함은 읽는 글이라 그대로 둔다 */
main.wide{max-width:1600px}
.tag{display:inline-flex;align-items:center;gap:9px;font:700 15px/1 var(--font);letter-spacing:.5px;color:#F1EDFF}
.tag i{width:14px;height:14px;border:1.6px solid var(--accent);transform:rotate(45deg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text3)}
.who button{min-height:36px;padding:0 12px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);color:var(--text2);font-size:13px}
.gate{min-height:60vh;display:grid;place-items:center;text-align:center}
.gate .box{display:grid;gap:14px;justify-items:center;max-width:320px}
.gate .lk{width:60px;height:60px;border:2px solid var(--accent);transform:rotate(45deg);display:grid;place-items:center}
.gate .lk::after{content:"";width:18px;height:18px;background:var(--accent);transform:rotate(-45deg);border-radius:3px}
.gate p{color:var(--text2);font-size:14px}
.gbtn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 18px;border-radius:10px;background:#F1EDFF;color:#0C0A15;font-weight:700}
.gbtn b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#0C0A15;color:#F1EDFF;font-size:12px}
.msg{padding:10px 12px;border-radius:10px;background:rgba(249,112,102,.12);color:#FDA29B;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats button{padding:10px 12px;border-radius:12px;background:var(--surface);display:grid;gap:2px;text-align:left;box-shadow:inset 0 0 0 1px transparent}
.stats button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent)}
.stats span{font-size:12px;color:var(--text3)}
.stats b{font:700 22px/1 var(--font);font-variant-numeric:tabular-nums}
.stats .s-new b{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-size:13px;color:var(--text2)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{color:#F1EDFF;background:#17122B;box-shadow:inset 0 0 0 1.5px var(--c,var(--accent))}
.list{display:grid;gap:10px}
.it{display:grid;gap:8px;padding:14px;border-radius:12px;background:var(--surface);box-shadow:inset 3px 0 0 var(--c)}
.it .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text3)}
.it .ty{font-weight:700;color:var(--c)}
.it .st{margin-left:auto;padding:3px 9px;border-radius:999px;font-weight:700;font-size:11px}
.st.new{background:rgba(167,143,255,.22);color:#F1EDFF}.st.seen{background:var(--raised);color:var(--text2)}.st.done{background:rgba(50,213,131,.16);color:#7EE2AE}
.it .tx{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.it .meta{display:flex;flex-wrap:wrap;gap:5px}
.it .meta span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--raised);color:var(--text2);overflow-wrap:anywhere}
.it .act{display:flex;flex-wrap:wrap;gap:6px}
.it .act button{min-height:34px;padding:0 11px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);box-shadow:inset 0 0 0 1px var(--line)}
.it .act button[aria-pressed="true"]{color:#F1EDFF;box-shadow:inset 0 0 0 1.5px var(--accent)}
.it .act .del{margin-left:auto;color:#FDA29B}
.it .act .del.sure{background:rgba(249,112,102,.18)}
.empty{padding:28px 12px;text-align:center;color:var(--text3)}
.copy{font-size:12px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
@media (max-width:420px){.stats b{font-size:19px}}

/* ── 탭 (문의함 · 대시보드) — 주소는 /soloclimbing/admin/ 그대로, 해시로만 가른다 ── */
.tabs{display:flex;gap:6px;padding:4px;border-radius:12px;background:var(--surface)}
.tabs button{flex:1;min-height:40px;padding:0 10px;border-radius:9px;font:700 14px/1 var(--font);color:var(--text2)}
.tabs button[aria-pressed="true"]{background:var(--raised);color:#F1EDFF;box-shadow:inset 0 0 0 1.5px var(--accent)}
.tabs .n{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:rgba(167,143,255,.22);color:#F1EDFF;font-size:11px;vertical-align:1px}

/* ── 대시보드 ──────────────────────────────────────────────────────────── */
.dash{display:grid;gap:14px}
/* PC 에서는 네 판(지금 · 수익 · 사용자 · 설치)을 가로로 나란히 — 한 화면에 담는다.
   폰·태블릿은 그대로 세로로 쌓인다 */
@media (min-width:1080px){
 .dash{grid-template-columns:repeat(4,minmax(0,1fr));align-items:start}
 .dash>.at,.dash>.hint{grid-column:1/-1;order:-1}
 .dash .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
 /* 「지금」 칸은 타일이 여섯이라 두 줄씩 쌓이면 칸이 너무 길어진다 — 셋씩 세운다 */
 .dash .now .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
 .dash .now .tile b{font-size:17px}
 .dash .tile b{font-size:19px}
 .dash .plot{height:48px}
 .dash .mins{height:44px}
 /* 칸이 좁아진 만큼 줄여 네 판이 한 화면에 들어가게 한다 */
 .dash .spark{aspect-ratio:600/110}
 .dash .pan{gap:9px;padding:12px}
 .dash .bars{gap:5px}
 .dash .bar{font-size:12px;gap:3px 8px}
 .dash .bar .t{height:5px}
 .dash .tiles{gap:6px}
 .dash .tile{padding:8px 9px}
}
.at{font-size:12px;color:var(--text3)}
.pan{display:grid;gap:11px;padding:14px;border-radius:12px;background:var(--surface)}
.pan h2{font:700 14px/1 var(--font);letter-spacing:.3px;color:var(--text2);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pan h2 em{font-style:normal;font-weight:500;font-size:12px;color:var(--text3)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tile{display:grid;gap:3px;padding:10px;border-radius:10px;background:var(--raised);min-width:0}
.tile span{font-size:11.5px;color:var(--text3);overflow-wrap:anywhere}
.tile b{font:700 clamp(16px,4.9vw,20px)/1.15 var(--font);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.hi b{color:var(--accent)}.tile.up b{color:#7EE2AE}.tile.down b{color:#FDA29B}
.spark{display:block;width:100%;height:auto;aspect-ratio:600/120;overflow:visible}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.bar .n{color:var(--text2);overflow-wrap:anywhere}
.bar .v{font-variant-numeric:tabular-nums;font-weight:700}
.bar .t{grid-column:1/-1;height:7px;border-radius:999px;background:var(--bg)}
.bar .t i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.warn{padding:10px 12px;border-radius:10px;background:rgba(249,112,102,.12);color:#FDA29B;font-size:13px;overflow-wrap:anywhere}

/* ── 지금 (실시간) — stats/live 를 onSnapshot 으로 듣는다 ──────────────────── */
.pan.now{box-shadow:inset 0 0 0 1.5px rgba(50,213,131,.3)}
.now .ping{display:inline-flex;align-items:center;gap:6px;color:#7EE2AE;font-weight:700;font-size:12px}
.now .ping i{width:7px;height:7px;border-radius:50%;background:#32D583}
@media (prefers-reduced-motion:no-preference){.now .ping i{animation:ping 2.2s ease-out infinite}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(50,213,131,.55)}70%{box-shadow:0 0 0 7px rgba(50,213,131,0)}100%{box-shadow:0 0 0 0 rgba(50,213,131,0)}}
.now .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.now .big{font:800 clamp(34px,10vw,46px)/1 var(--font);font-variant-numeric:tabular-nums;color:#7EE2AE}
.now .big small{font:500 13px/1 var(--font);color:var(--text3);margin-left:7px}
.mins{display:flex;align-items:flex-end;gap:2px;height:56px;padding-top:4px}
.mins i{flex:1 1 0;min-width:0;min-height:2px;border-radius:2px 2px 0 0;background:var(--accent);opacity:.8}
.mins i.zero{background:var(--raised);opacity:1}
.mins i.last{opacity:1;background:#7EE2AE}
/* 눈금 — 막대 높이를 「몇 명」으로 읽게 한다. 눈금 없이 비율만 그리면 두 명이 꽉 찬 막대가 된다 */
.plot{position:relative;height:60px;padding-left:32px;margin-top:4px}
.plot .mins{height:100%;padding-top:0}
.plot .gl{position:absolute;left:32px;right:0;border-top:1px dashed var(--line);pointer-events:none}
.plot .gl b{position:absolute;left:-32px;top:-6px;width:28px;text-align:right;font:500 10px/1 var(--font);color:var(--text3);font-variant-numeric:tabular-nums;white-space:nowrap}
.plot+.axis{padding-left:32px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.mins.ret{height:50px}
.mins.ret i{background:#7EE2AE;opacity:.85}
.mins.ret+.axis span{flex:1 1 0;text-align:center}
/* 세계지도 — 나라 칩 대신. 땅은 적도원통으로 눕힌 윤곽 하나고 사람은 점으로 찍는다 */
.wmap{width:100%;height:auto;display:block;border-radius:9px;background:var(--bg)}
.wmap .land{fill:#24242E}
.wmap .dot{fill:#32D583;fill-opacity:.5;stroke:#7EE2AE;stroke-width:2.5;vector-effect:non-scaling-stroke}
.wmap .dot.top{fill-opacity:.75}
.chips2{display:flex;flex-wrap:wrap;gap:5px}
.chips2 span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--text2);overflow-wrap:anywhere}
.chips2 span b{color:var(--text);font-variant-numeric:tabular-nums}
.sub2{font-size:12px;color:var(--text3);margin-top:-4px}
.hint{display:grid;gap:10px;justify-items:center;padding:26px 14px;border-radius:12px;background:var(--surface);text-align:center}
.hint b{font-size:15px}.hint p{font-size:13.5px;color:var(--text2);max-width:46ch}
.hint code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--raised);padding:2px 6px;border-radius:5px;overflow-wrap:anywhere}
</style></head><body>
<main>
 <div class="top"><p class="tag"><i aria-hidden="true"></i>[ 관리자 ]</p><div class="who" id="who" hidden><span id="who-n">관리자로 로그인됨</span><button type="button" id="out">로그아웃</button></div></div>

 <div class="tabs" id="tabs" role="tablist" hidden>
  <button type="button" role="tab" data-t="문의" aria-pressed="true">문의함<span class="n" id="tab-n" hidden></span></button>
  <button type="button" role="tab" data-t="대시보드" aria-pressed="false">대시보드</button>
 </div>

 <section class="gate" id="gate">
  <div class="box">
   <span class="lk" aria-hidden="true"></span>
   <b>오너만 볼 수 있어요</b>
   <p>오너 구글 계정으로 로그인하면 문의함이 열려요. 다른 계정은 읽기가 막혀 있어요.</p>
   <button type="button" class="gbtn" id="in"><b>G</b>구글로 로그인</button>
   <p class="msg" id="gate-msg" role="alert" hidden></p>
  </div>
 </section>

 <section id="box" hidden aria-label="문의 목록">
  <div style="display:grid;gap:12px">
   <div class="stats" id="stats"></div>
   <div class="chips" id="types"></div>
   <p class="msg" id="box-msg" role="alert" hidden></p>
   <div class="list" id="list"></div>
  </div>
 </section>

 <section id="dash" class="dash" hidden aria-label="대시보드"></section>
</main>

<script type="module">
// Firebase 웹 설정 (공개 값 — 비밀이 아니다. 읽기는 보안 규칙이 막는다)
const C = {"apiKey":"AIzaSyBT2706pHuJZNlCb_eXFR86dBj1q7E1HDg","authDomain":"solo-climbing.firebaseapp.com","projectId":"solo-climbing","storageBucket":"solo-climbing.firebasestorage.app","messagingSenderId":"237692887773","appId":"1:237692887773:web:7167f357e7f6100e01b134"};
const V = '10.12.2';
const $ = id => document.getElementById(id);
const TY = { bug: ['불편해요 · 오류', 'var(--bug)'], idea: ['이런 기능 있으면', 'var(--idea)'], gym: ['암장 정보가 달라요', 'var(--gym)'], etc: ['기타', 'var(--etc)'] };
const ST = { new: '새 글', seen: '확인함', done: '반영됨' };
let items = [], fType = 'all', fSt = 'all', unsub = null;
// 탭 — 기본은 문의함이다. Slack DM 의 «전체 보기» 를 눌렀을 때 지금과 똑같이 보여야 한다
let 로그인 = false, 탭 = location.hash === '#대시보드' ? '대시보드' : '문의', 통계 = null, 통계상태 = '아직', 통계읽기 = null;
// 실시간 — stats/live. 하루치와 달리 한 번 읽고 끝이 아니라 계속 듣는다(onSnapshot)
let 실시간 = null, unsubLive = null;
const show = (el, m) => { el.textContent = m; el.hidden = !m; };

if (!C) { show($('gate-msg'), 'Firebase 설정이 아직 들어가지 않았어요.'); $('in').disabled = true; }
else {
  const appM = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const authM = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const fsM = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = appM.initializeApp(C), auth = authM.getAuth(app), db = fsM.getFirestore(app);
  const prov = new authM.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
  // 로그인 — 팝업이 막히는 폰에서는 넘겨서 로그인
  $('in').onclick = async () => { show($('gate-msg'), ''); try { await authM.signInWithPopup(auth, prov); } catch (e) { if (/popup/.test(e.code || '')) authM.signInWithRedirect(auth, prov); else show($('gate-msg'), '로그인하지 못했어요. 다시 눌러 주세요.'); } };
  $('out').onclick = () => authM.signOut(auth);
  authM.getRedirectResult(auth).catch(() => {});
  // 대시보드 자료 — 이 PC 의 stats/collect.js 가 하루 한 번 쓴다. 읽기는 한 번뿐이다(실시간 아님)
  통계읽기 = async () => {
    통계상태 = '읽는중'; 뷰();
    try {
      const d = await fsM.getDoc(fsM.doc(db, 'stats', 'summary'));
      통계 = d.exists() ? d.data() : null;
      통계상태 = 통계 ? '됨' : '없음';
    } catch (e) {
      통계 = null;
      통계상태 = e.code === 'permission-denied' ? '막힘' : '실패';
    }
    뷰();
  };
  authM.onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    if (unsubLive) { unsubLive(); unsubLive = null; }
    if (!user) { 로그인 = false; 통계 = null; 실시간 = null; 통계상태 = '아직'; $('who').hidden = true; 뷰(); return; }
    $('who').hidden = false;
    로그인 = true; 뷰();
    통계읽기();
    // 수집기가 1분마다 새로 쓰면 페이지를 열어 둔 채로 숫자가 바뀐다
    unsubLive = fsM.onSnapshot(fsM.doc(db, 'stats', 'live'), d => {
      실시간 = d.exists() ? d.data() : null;
      if (탭 === '대시보드') 대시보드();
    }, () => { 실시간 = null; if (탭 === '대시보드') 대시보드(); });
    const q = fsM.query(fsM.collection(db, 'inquiries'), fsM.orderBy('createdAt', 'desc'), fsM.limit(300));
    unsub = fsM.onSnapshot(q, snap => {
      items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      로그인 = true; 뷰(); render();
    }, e => {
      // 오너 계정이 아니면 규칙이 읽기를 막는다
      $('box').hidden = true; $('gate').hidden = false;
      show($('gate-msg'), e.code === 'permission-denied' ? '이 계정은 문의함을 볼 수 없어요. 오너 계정으로 다시 로그인해 주세요.' : '문의를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.');
      authM.signOut(auth);
    });
  });
  window.__setStatus = async (id, st) => { try { await fsM.updateDoc(fsM.doc(db, 'inquiries', id), { status: st }); } catch (e) { show($('box-msg'), '상태를 바꾸지 못했어요.'); } };
  window.__del = async id => { try { await fsM.deleteDoc(fsM.doc(db, 'inquiries', id)); } catch (e) { show($('box-msg'), '지우지 못했어요.'); } };
}

const ago = ts => { if (!ts || !ts.toDate) return '방금'; const d = ts.toDate(), s = (Date.now() - d) / 1000;
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전'; if (s < 86400 * 7) return Math.floor(s / 86400) + '일 전';
  return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
function render() {
  const cnt = st => items.filter(i => (st === 'all' || (i.status || 'new') === st)).length;
  $('stats').innerHTML = ['new', 'seen', 'done'].map(k => `<button type="button" class="s-${k}" aria-pressed="${fSt === k}" data-s="${k}"><span>${ST[k]}</span><b>${cnt(k)}</b></button>`).join('');

/** 초를 사람이 읽는 말로 — 「19분 49초」 · 「1시간 3분」 */
function 걸린시간(초) {
  if (!Number.isFinite(초) || 초 < 0) return '아직 몰라요';
  if (초 < 60) return 초 + '초';
  const 분 = Math.floor(초 / 60);
  if (분 < 60) return 분 + '분 ' + (초 % 60) + '초';
  return Math.floor(분 / 60) + '시간 ' + (분 % 60) + '분';
}

/** 나라별을 세계지도에 찍는다. 자리를 모르는 나라는 아래에 칩으로 남긴다(빠뜨리지 않으려고) */
function 나라지도(목록) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  // 남극은 쓸모가 없어 잘라 낸다 — 위도 83도에서 −57도까지만 보인다
  svg.setAttribute('viewBox', '0 14 720 280');
  svg.setAttribute('class', 'wmap');
  svg.setAttribute('role', 'img');
  const 바닥 = document.createElementNS(NS, 'path');
  바닥.setAttribute('d', 땅); 바닥.setAttribute('class', 'land');
  svg.append(바닥);

  const 큰 = Math.max(...목록.map((x) => x.n), 1);
  const 모름 = [], 읽기 = [];
  목록.forEach((x, i) => {
    const 이름 = 나라이름[x.name] || x.name;
    const 자리 = 나라자리[x.name];
    if (!자리) { 모름.push(x); return; }
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', 자리[0]); c.setAttribute('cy', 자리[1]);
    // 작은 나라도 보여야 하니 밑바닥을 두되, 한국과 일본이 18칸밖에 안 떨어져 있어
    // 점이 커지면 한 덩어리로 뭉친다 — 그래서 천천히 키운다
    c.setAttribute('r', (3.5 + Math.sqrt(x.n / 큰) * 8).toFixed(1));
    c.setAttribute('class', i === 0 ? 'dot top' : 'dot');
    const t = document.createElementNS(NS, 'title');
    t.textContent = 이름 + ' ' + x.n + '명';
    c.append(t); svg.append(c);
    읽기.push(이름 + ' ' + x.n + '명');
  });
  모름.forEach((x) => 읽기.push((나라이름[x.name] || x.name) + ' ' + x.n + '명'));
  svg.setAttribute('aria-label', '나라별 — ' + (읽기.join(' · ') || '아직 없어요'));
  return { svg, 모름 };
}

    i.style.height = Math.max(2, d.rate) + '%';
    if (!d.users) i.classList.add('zero');
    i.title = 'D' + d.day + ' · ' + d.rate + '% · ' + 수(d.users) + '명';
    띠.append(i);
  }
  const 축 = 만들기('div', 'axis');
  for (const d of 날들) 축.append(만들기('span', null, 'D' + d.day));
  const d1 = 날들.find(x => x.day === 1);
  const 값 = 만들기('p', 'sub2');
  값.textContent = '다음 날 ' + (d1 ? d1.rate + '%' : '—')
    + ' — 뒤로 갈수록 아직 날이 안 찬 사람이 섞여 낮게 나와요';
  w.append(띠, 축, 값);
  return w;
}

/**
 * 한 사람이 하루에 벌어 주는 돈. 광고 앱의 한 줄짜리 성적이다.
 * **최근 7일 수익 ÷ (7 × DAU)** 로 센다 — 하루치만 쓰면 그날 운에 너무 흔들린다.
 */
function ARPDAU(r, u) {
  if (!r || !u || !u.dau) return '아직 몰라요';
  const v = (r.last7 || 0) / 7 / u.dau;
  return 'US$' + v.toFixed(3);
}

/** 사람이 읽는 이름은 수집기가 stats/config.json 을 보고 이미 붙여 둔다. 여기서는 받아 쓰기만 한다 */
function 이름고치기(u) {
  return u.name || u.id || '이름 없는 광고 자리';
}
